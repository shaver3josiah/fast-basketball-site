<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A0A0C">
<title>Fast Basketball Content Admin</title>
<link rel="icon" href="/brand/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon-180.png">
<!-- The site's own font files. Unhashed on purpose: this page is no-store, and a
     stale copy costs at worst a fallback face, never a broken panel. -->
<link rel="stylesheet" href="/styles/fonts.css">
<link rel="stylesheet" href="/admin/tokens.css">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<div id="loginScreen" class="screen">
  <form class="login-card" id="loginForm">
    <h1><img src="/brand/logo-white.svg" alt="Fast Basketball" width="250" height="106"></h1>
    <p class="login-kicker">Content Admin</p>
    <p id="deviceNote" class="login-note"></p>

    <label for="loginDuration">Stay signed in for</label>
    <select id="loginDuration">
      <option value="visit" selected>This visit (2 hours)</option>
      <option value="day">1 day</option>
      <option value="week">1 week</option>
      <option value="month">30 days</option>
    </select>

    <!-- Step 1: ask for a code. Step 2 (the code field) appears once it is sent. -->
    <button type="button" id="sendCodeBtn" class="btn primary">Email me a sign-in code</button>

    <div id="codeStep" hidden>
      <label for="loginCode">6-digit code</label>
      <input type="text" id="loginCode" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" maxlength="6" placeholder="123456">
      <button type="submit" id="verifyBtn" class="btn primary">Verify and sign in</button>
      <button type="button" id="resendBtn" class="btn ghost">Send a new code</button>
    </div>

    <p id="loginError" class="error" role="alert"></p>
  </form>
</div>

<div id="adminScreen" class="screen hidden">
  <header class="admin-top">
    <img class="bar-mark" src="/brand/icon.svg" alt="" width="28" height="28">
    <h1 id="tabTitle">Content</h1>
    <span id="saveStatus" class="status"></span>
  </header>

  <main id="tabContent" class="tab-panel"></main>
  <main id="tabPhotos" class="tab-panel hidden"></main>
  <main id="tabLeads" class="tab-panel hidden"></main>

  <!-- Outside the three panels because admin.js empties those on every render, and
       these three buttons are wired up once at load. -->
  <details class="tools" id="tools">
    <summary>More</summary>
    <div class="tools-body">
      <button id="previewLockerBtn" class="btn" type="button">Preview the Locker</button>
      <button id="backupBtn" class="btn" type="button">Download backup</button>
      <a class="btn" href="/admin/editor.html">Full editor (computer)</a>
    </div>
  </details>

  <div class="dock">
    <div class="actions" id="actionBar">
      <button id="previewBtn" class="btn" type="button">Preview</button>
      <button id="saveBtn" class="btn" type="button">Save</button>
      <button id="publishBtn" class="btn primary" type="button">Publish</button>
    </div>
    <nav class="tabbar">
      <button data-tab="content" class="tab active" type="button">Content</button>
      <button data-tab="photos" class="tab" type="button">Photos</button>
      <button data-tab="leads" class="tab" type="button">Leads</button>
    </nav>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="/admin/schema.js"></script>
<script src="/admin/plans.js"></script>
<script src="/admin/admin.js" defer></script>
</body>
</html>
