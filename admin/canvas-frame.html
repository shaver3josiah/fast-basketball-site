<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>Canvas surface</title>
<!-- The real site stylesheets, loaded in an isolated document.
     base.css styles bare elements (body, h1, a, button), so loading it into the
     editor's own document would restyle the editor chrome. An iframe is the cheap,
     total fix: the canvas gets the site's exact cascade and the editor keeps its own.

     The list below is GENERATED by build.mjs from render.mjs stylesheetLinks(), the
     same function every published page uses. It was hand-maintained once and promptly
     drifted: the frame was missing site.css, features.css and fb-polish.css, so the
     editor was previewing a cascade the live site does not have. "What you drag is
     what ships" only holds if this list cannot be forgotten. -->
<!--SITE_STYLES-->
<!-- theme.js puts .fb-light on <html> and the site defaults to LIGHT. Without it the
     editor rendered every canvas in dark while the published page was light, so the
     editor and the live page simply did not look like each other. Same script, same
     position in <head>, same result. -->
<script src="/js/theme.js"></script>
<style>
  /* The artboard never scrolls — the pane around it does. A scrollbar inside the frame
     steals ~17px, so the canvas would be 1423px while every percentage in the document
     is measured against 1440, and every drag would land slightly off. */
  html, body { margin: 0; padding: 0; background: var(--court-black); overflow: hidden; }
  /* The compiled section's own generated rules land here at runtime. */
</style>
<style id="sectionCss"></style>
<style>
  /* Editing affordances. Scoped to .is-editing so a screenshot of the frame with the
     class removed is exactly the published page — no editor furniture baked in. */
  .is-editing .cv-el { cursor: grab; }
  .is-editing .cv-el:hover { outline: 1px solid var(--red-hot); outline-offset: 2px; }
  .is-editing .cv-el.is-selected { outline: 2px solid var(--fast-red); outline-offset: 2px; }
  .is-editing .cv-el.is-locked { cursor: not-allowed; }

  /* moveable draws its control box into the document; keep it above the artwork. */
  .moveable-control-box { z-index: 9999; }

  /* An empty section still needs to be a drop target with a visible extent. */
  .cv-sec:empty::after {
    content: 'Empty section';
    display: grid; place-items: center; height: 100%;
    color: var(--text-faint-dark); font: 500 .9rem/1 var(--font-body);
  }
</style>
</head>
<body>
<div id="stage"></div>
<script src="/admin/vendor/moveable.min.js"></script>
<script src="/admin/canvas-frame.js"></script>
</body>
</html>
