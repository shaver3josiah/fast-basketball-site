[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--include=dev"
  TZ = "America/New_York"

# Every top-level file in the functions directory becomes a function, and the name is the
# filename, so a dot in it is a deploy error: "checkout.test" is not a legal function name and
# it failed the first deploy. Tests therefore live in functions/tests/, which Netlify ignores
# because a subdirectory is only a function when it holds a file matching its own name. Keep
# new tests there, or in functions/lib/, never beside a handler.
[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"
  included_files = ["src/data/**", "src/templates/**"]

# Permissions-Policy keeps payment=() even though the site sells through Stripe: hosted
# Checkout runs on stripe.com, so no page we serve ever calls the Payment Request API.
# Only embedded Checkout or Elements would need payment=(self) here and js.stripe.com in
# script-src. form-action lists checkout.stripe.com because the no-JS enroll form posts
# to our checkout function, which answers 303 to Stripe, and Chrome applies form-action
# to redirect targets.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Security-Policy-Report-Only = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https://checkout.stripe.com; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; upgrade-insecure-requests"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/styles/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"

# Stripe's success_url. Copy only, never proof of payment, and not worth indexing.
[[headers]]
  for = "/enroll/thanks/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[redirects]]
  from = "/playbook/generate"
  to = "/.netlify/functions/playbook"
  status = 200

[[redirects]]
  from = "/coach"
  to = "/coach-blake-kingsley"
  status = 301
  force = true

# Private small group and the $50 drop-in were retired by the September 2026 price sheet.
# The page was indexed and linked from every footer, so it redirects rather than 404s.
[[redirects]]
  from = "/training/small-group"
  to = "/training/group-training"
  status = 301
  force = true

[[redirects]]
  from = "/training"
  to = "/training/evaluation"
  status = 301
  force = true

[[redirects]]
  from = "/basketball-training"
  to = "/#areas"
  status = 301
  force = true

[[redirects]]
  from = "/free-session"
  to = "/training/evaluation"
  status = 301
  force = true

