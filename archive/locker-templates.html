document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

slateY(-50%);transition:transform .35s var(--ease-rush)}\n.faq-i.open .faq-q::before{transform:translateY(-50%) rotate(90deg) scaleX(0)}\n.faq-a{max-height:0;overflow:hidden;transition:max-height .45s var(--ease-rush)}\n.faq-a p{padding:0 0 26px;color:var(--text-soft-light);max-width:70ch}\n.band-dark .faq-a p,.band-ink .faq-a p{color:var(--text-body-dark)}\n.faq-i.open .faq-a{max-height:340px}\n/* toast */\n.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,120px);z-index:990;background:var(--fast-red);color:var(--bone);padding:13px 26px;border-radius:var(--r-pill);font-family:var(--font-eyebrow);letter-spacing:.12em;text-transform:uppercase;font-size:.8rem;transition:transform .45s var(--ease-rush)}\n.toast.show{transform:translate(-50%,0)}\n/* animated lockup — the real vector (assets/logo-anim.svg) built part by part; used via LogoAnimated */\n.alogo{display:block;line-height:0}\n.alogo svg{display:block;width:100%;height:auto;overflow:visible}\n.alogo path{transform-box:fill-box;transform-origin:50% 50%}\n.alogo .al-ln{transform-origin:100% 50%}\n.alogo .al-rule-l{transform-origin:100% 50%}\n.alogo .al-rule-r{transform-origin:0 50%}\n.alogo.play .al-lt{animation:alLetter .6s var(--ease-rush) both}\n.alogo.play .al-f{animation-delay:.05s}\n.alogo.play .al-a{animation-delay:.14s}\n.alogo.play .al-st{animation-delay:.23s}\n.alogo.play .al-ln{animation:alLine .55s var(--ease-rush) both,alGust 1.1s ease-in-out;animation-delay:calc(.3s + var(--i)*.05s),calc(1.72s + var(--i)*.06s)}\n.alogo.play .al-notch{animation:alNotch .42s var(--ease-reveal) both;animation-delay:.52s}\n.alogo.play .al-cres{animation:alCres .62s var(--ease-rush) both;animation-delay:.6s}\n.alogo.play .al-rule{animation:alRule .5s var(--ease-rush) both;animation-delay:.98s}\n.alogo.play .al-wl{animation:alWord .45s var(--ease-reveal) both;animation-delay:calc(.88s + var(--i)*.035s)}\n@keyframes alLetter{0%{opacity:0;transform:translateX(-430px) skewX(-14deg)}55%{opacity:1;transform:translateX(24px) skewX(2deg)}100%{opacity:1;transform:none}}\n@keyframes alLine{0%{opacity:0;transform:translateX(-300px) scaleX(2.4)}60%{opacity:1}100%{opacity:1;transform:none}}\n@keyframes alNotch{0%{opacity:0;transform:translate(110px,-120px)}62%{opacity:1;transform:translate(-8px,7px)}100%{opacity:1;transform:none}}\n@keyframes alCres{0%{clip-path:inset(-10% 102% -10% -2%)}100%{clip-path:inset(-10% -2% -10% -2%)}}\n@keyframes alRule{0%{transform:scaleX(0)}100%{transform:none}}\n@keyframes alWord{0%{opacity:0;transform:translateY(64px)}62%{opacity:1;transform:translateY(-7px)}100%{opacity:1;transform:none}}\n@keyframes alGust{0%,100%{opacity:1}45%{opacity:.55}}\n/* responsive floors */\n@media(max-width:1040px){.mth{grid-template-columns:repeat(2,1fr)}.mth-s{border-bottom:var(--border-card)}}\n@media(max-width:520px){.mth{grid-template-columns:1fr}.fld-row{grid-template-columns:1fr}}\n\n<\u002Fstyle>\n<script src=\"25e9a2ce-656a-43d4-a1ff-dc5e014e3046\"><\u002Fscript>\n<style>\n  body{margin:0;background:var(--court-black);color:var(--bone);font-family:var(--font-body);-webkit-print-color-adjust:exact;print-color-adjust:exact;}\n  a{color:var(--red-hot);}\n  a:hover{color:var(--bone);}\n  .rail::-webkit-scrollbar{height:0;}\n  /* Active tab is interactive state React owns; inline styles cannot express it per item. */\n  .rail [data-t][data-on=\"true\"]{background:var(--fast-red) !important;color:#FFFFFF !important;border-color:transparent !important;}\n  .rail [data-t=\"midnight\"][data-on=\"true\"]{background:var(--miami-teal) !important;color:#0A0A0C !important;}\n  @keyframes fbRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}\n  @keyframes fbToast{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}\n  /* Screen is court-black. Print flips the tokens on the sheet, so every inline\n     var(--token) colour turns into its paper equivalent with no !important war. */\n  @media print{\n    @page{margin:14mm;}\n    html,body{background:#FFFFFF;}\n    .np{display:none !important;}\n    .sheet{\n      --bone:#0A0A0C;--court-black:#FFFFFF;--ink:#FFFFFF;--ink-lift:#FFFFFF;\n      --text-lede-dark:#43434E;--text-body-dark:#43434E;--text-dim-dark:#54545F;\n      --text-faint-dark:#6C6C78;--text-mute-dark:#6C6C78;--text-label-dark:#54545F;\n      --line-dark:rgba(10,10,12,0.20);--red-tint:rgba(230,12,32,0.06);\n      --shadow-card:none;--shadow-light:none;\n      max-width:none;margin:0;padding:0;\n    }\n    .sheet .pk{box-shadow:none;break-inside:avoid;}\n    .sheet .plogo{display:block !important;}\n    .sheet .hollow{filter:none;}\n    .sheet .pgb{display:none;}\n  }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<header class=\"np\" style=\"position:sticky;top:0;z-index:100;background:rgba(10,10,12,0.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line-dark)\">\n  <div style=\"max-width:1000px;margin:0 auto;padding:12px clamp(16px,3vw,28px);display:flex;align-items:center;gap:16px;flex-wrap:wrap\">\n    <img src=\"39e6d165-311f-4982-8a70-4a63f0523d3b\" width=\"34\" height=\"34\" alt=\"Fast Basketball\">\n    <div style=\"flex:1;min-width:120px\">\n      <div style=\"font-family:var(--font-eyebrow);font-weight:700;font-size:0.9rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--bone);line-height:1.1\">The Locker<\u002Fdiv>\n      <div style=\"font-family:var(--font-body);font-size:0.78rem;color:var(--text-faint-dark);line-height:1.3\">Training templates<\u002Fdiv>\n    <\u002Fdiv>\n    <button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ toggleShoot }}\" style=\"min-height:44px\">Shoot Around<\u002Fbutton>\n    <button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ resetSheet }}\" style=\"min-height:44px\">Clear Sheet<\u002Fbutton>\n    <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ printSheet }}\" style=\"min-height:44px\">Print<\u002Fbutton>\n  <\u002Fdiv>\n  <div class=\"rail\" ref=\"{{ railRef }}\" sc-camel-on-click=\"{{ onTab }}\" style=\"max-width:1000px;margin:0 auto;padding:0 clamp(16px,3vw,28px) 12px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none\">\n    <button type=\"button\" data-t=\"daily\" data-on=\"{{ dailyOn }}\" style=\"flex:none;min-height:44px;padding:10px 18px;border-radius:100px;border:1px solid var(--line-dark);background:transparent;color:var(--text-dim-dark);font-family:var(--font-eyebrow);font-weight:700;font-size:0.82rem;letter-spacing:0.14em;text-transform:uppercase;cursor:pointer;transition:all var(--t-hover) var(--ease-rush)\">Daily Session<\u002Fbutton>\n    <button type=\"button\" data-t=\"block\" data-on=\"{{ blockOn }}\" style=\"flex:none;min-height:44px;padding:10px 18px;border-radius:100px;border:1px solid var(--line-dark);background:transparent;color:var(--text-dim-dark);font-family:var(--font-eyebrow);font-weight:700;font-size:0.82rem;letter-spacing:0.14em;text-transform:uppercase;cursor:pointer;transition:all var(--t-hover) var(--ease-rush)\">4-Week Block<\u002Fbutton>\n    <button type=\"button\" data-t=\"fuel\" data-on=\"{{ fuelOn }}\" style=\"flex:none;min-height:44px;padding:10px 18px;border-radius:100px;border:1px solid var(--line-dark);background:transparent;color:var(--text-dim-dark);font-family:var(--font-eyebrow);font-weight:700;font-size:0.82rem;letter-spacing:0.14em;text-transform:uppercase;cursor:pointer;transition:all var(--t-hover) var(--ease-rush)\">Game-Day Fuel<\u002Fbutton>\n    <button type=\"button\" data-t=\"recipe\" data-on=\"{{ recipeOn }}\" style=\"flex:none;min-height:44px;padding:10px 18px;border-radius:100px;border:1px solid var(--line-dark);background:transparent;color:var(--text-dim-dark);font-family:var(--font-eyebrow);font-weight:700;font-size:0.82rem;letter-spacing:0.14em;text-transform:uppercase;cursor:pointer;transition:all var(--t-hover) var(--ease-rush)\">Recipe<\u002Fbutton>\n    <sc-if value=\"{{ unlocked }}\" hint-placeholder-val=\"{{ false }}\">\n      <button type=\"button\" data-t=\"midnight\" data-on=\"{{ midnightOn }}\" style=\"flex:none;min-height:44px;padding:10px 18px;border-radius:100px;border:1px solid var(--teal-line);background:transparent;color:var(--miami-teal);font-family:var(--font-eyebrow);font-weight:700;font-size:0.82rem;letter-spacing:0.14em;text-transform:uppercase;cursor:pointer;transition:all var(--t-hover) var(--ease-rush)\">The Midnight Set<\u002Fbutton>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n  <div class=\"pgb\" style=\"height:3px;background:var(--line-dark)\">\n    <div style=\"height:100%;background:var(--fast-red);width:{{ pct }};transition:width var(--t-hover) var(--ease-rush)\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<main class=\"sheet\" ref=\"{{ sheetRef }}\" sc-camel-on-change=\"{{ onCheck }}\" style=\"max-width:1000px;margin:0 auto;padding:clamp(26px,4vw,44px) clamp(16px,3vw,28px) 90px\">\n\n<sc-if value=\"{{ isDaily }}\" hint-placeholder-val=\"{{ true }}\">\n<article data-screen-label=\"Daily Session\" style=\"display:grid;gap:16px;animation:fbRise var(--t-reveal) var(--ease-rush) both\">\n\n  <div class=\"pk\" style=\"background:var(--ink-lift);border:1px solid var(--line-dark);border-radius:18px;padding:clamp(20px,3vw,34px)\">\n    <div style=\"display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px\">\n      <span class=\"eyebrow\" style=\"color:var(--bone)\">Daily Session<\u002Fspan>\n    <\u002Fdiv>\n    <h1 style=\"font-family:var(--font-display);text-transform:uppercase;font-size:clamp(2.1rem,5.4vw,3.4rem);line-height:0.94;letter-spacing:0.01em;color:var(--bone);margin:0 0 16px\">The Daily <span class=\"hollow\">Sixty.<\u002Fspan><\u002Fh1>\n    <p style=\"font-family:var(--font-body);font-size:var(--text-lede);line-height:1.6;color:var(--text-lede-dark);max-width:62ch;margin:0;text-wrap:pretty\">Sixty minutes, a ball, and a hoop. This is the session Coach Blake hands a player who has no gym, no partner, and no excuse left. Every line is a make or a clock, not a vibe.<\u002Fp>\n    <div style=\"display:flex;gap:16px;flex-wrap:wrap;margin-top:24px\">\n      <label style=\"flex:1 1 180px;min-width:150px\">\n        <span style=\"display:block;font-family:var(--font-eyebrow);font-weight:700;font-size:0.7rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--text-label-dark);margin-bottom:6px\">Player<\u002Fspan>\n        <input type=\"text\" data-k=\"d.player\" style=\"width:100%;background:transparent;border:0;border-bottom:1.5px solid var(--line-dark);color:var(--bone);font-family:var(--font-body);font-size:16px;padding:7px 2px;min-height:40px\">\n      <\u002Flabel>\n      <label style=\"flex:1 1 140px;min-width:130px\">\n        <span style=\"display:block;font-family:var(--font-eyebrow);font-weight:700;font-size:0.7rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--text-label-dark);margin-bottom:6px\">Date<\u002Fspan>\n        <input type=\"text\" data-k=\"d.date\" style=\"width:100%;background:transparent;border:0;border-bottom:1.5px solid var(--line-dark);color:var(--bone);font-family:var(--font-body);font-size:16px;padding:7px 2px;min-height:40px\">\n      <\u002Flabel>\n      <label style=\"flex:0 1 120px;min-width:110px\">\n        <span style=\"display:block;font-family:var(--font-eyebrow);font-weight:700;font-size:0.7rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--text-label-dark);margin-bottom:6px\">Session No.<\u002Fspan>\n        <input type=\"text\" data-k=\"d.no\" style=\"width:100%;background:transparent;border:0;border-bottom:1.5px solid var(--line-dark);color:var(--bone);font-family:var(--font-body);font-size:16px;padding:7px 2px;min-height:40px\">\n      <\u002Flabel>\n    <\u002Fdiv>\n    <p class=\"np\" style=\"font-family:var(--font-body);font-size:0.8rem;color:var(--text-faint-dark);margin:18px 0 0\">{{ doneLabel }} · Ticks save on this device.<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"pk\" style=\"background:var(--ink-lift);border:1px solid var(--line-dark);border-radius:14px;padding:clamp(18px,2.4vw,26px)\">\n    <div style=\"display:flex;align-items:baseline;gap:12px;margin-bottom:2px\">\n      <b style=\"font-family:var(--font-num);font-size:26px;line-height:1;color:var(--fast-red)\">01<\u002Fb>\n      <h3 style=\"flex:1;font-family:var(--font-display);text-transform:uppercase;font-size:20px;line-height:1;letter-spacing:0.01em;color:var(--bone);margin:0\">Warm the engine<\u002Fh3>\n      <span style=\"font-family:var(--font-eyebrow);font-weight:700;font-size:0.72rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--text-faint-dark)\">8 Min<\u002Fspan>\n    <\u002Fdiv>\n    <label style=\"display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n      <input type=\"checkbox\" data-k=\"d.1\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:2px 0 0;cursor:pointer\">\n      <span style=\"flex:1;min-width:0\">\n        <span style=\"display:block;font-family:var(--font-body);font-weight:600;font-size:16px;line-height:1.35;color:var(--bone)\">Ball slaps and wrist snaps<\u002Fspan>\n        <span style=\"display:block;font-family:var(--font-body);font-size:14px;line-height:1.45;color:var(--text-dim-dark);margin-top:3px\">Wake the hands up. Loud enough that someone hears it.<\u002Fspan>\n      <\u002Fspan>\n      <b style=\"font-family:var(--font-num);font-size:19px;line-height:1.2;color:var(--fast-red);flex:none;padding-left:12px;white-space:nowrap\">45 SEC<\u002Fb>\n    <\u002Flabel>\n    <label style=\"display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n      <input type=\"checkbox\" data-k=\"d.2\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:2px 0 0;cursor:pointer\">\n      <span style=\"flex:1;min-width:0\">\n        <span style=\"display:block;font-family:var(--font-body);font-weight:600;font-size:16px;line-height:1.35;color:var(--bone)\">Figure eights, low and fast<\u002Fspan>\n        <span style=\"display:block;font-family:var(--font-body);font-size:14px;line-height:1.45;color:var(--text-dim-dark);margin-top:3px\">Chest over the knees. Eyes on the rim, not the ball.<\u002Fspan>\n      <\u002Fspan>\n      <b style=\"font-family:var(--font-num);font-size:19px;line-height:1.2;color:var(--fast-red);flex:none;padding-left:12px;white-space:nowrap\">60 SEC<\u002Fb>\n    <\u002Flabel>\n    <label style=\"display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n      <input type=\"checkbox\" data-k=\"d.3\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:2px 0 0;cursor:pointer\">\n      <span style=\"flex:1;min-width:0\">\n        <span style=\"display:block;font-family:var(--font-body);font-weight:600;font-size:16px;line-height:1.35;color:var(--bone)\">Pound dribble, right then left<\u002Fspan>\n        <span style=\"display:block;font-family:var(--font-body);font-size:14px;line-height:1.45;color:var(--text-dim-dark);margin-top:3px\">Below the knee the whole time. Head up.<\u002Fspan>\n      <\u002Fspan>\n      <b style=\"font-family:var(--font-num);font-size:19px;line-height:1.2;color:var(--fast-red);flex:none;padding-left:12px;white-space:nowrap\">30 SEC EA<\u002Fb>\n    <\u002Flabel>\n    <label style=\"display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n      <input type=\"checkbox\" data-k=\"d.4\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:2px 0 0;cursor:pointer\">\n      <span style=\"flex:1;min-width:0\">\n        <span style=\"display:block;font-family:var(--font-body);font-weight:600;font-size:16px;line-height:1.35;color:var(--bone)\">Walking lunge, ball under the leg<\u002Fspan>\n        <span style=\"display:block;font-family:var(--font-body);font-size:14px;line-height:1.45;color:var(--text-dim-dark);margin-top:3px\">Slow. If you wobble, you are not warm yet.<\u002Fspan>\n      <\u002Fspan>\n      <b style=\"font-family:var(--font-num);font-size:19px;line-height:1.2;color:var(--fast-red);flex:none;padding-left:12px;white-space:nowrap\">10 EA<\u002Fb>\n    <\u002Flabel>\n    <label style=\"display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n      <input type=\"checkbox\" data-k=\"d.5\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:2px 0 0;cursor:pointer\">\n      <span style=\"flex:1;min-width:0\">\n        <span style=\"display:block;font-family:var(--font-body);font-weight:600;font-size:16px;line-height:1.35;color:var(--bone)\">Baseline builds, half speed to full<\u002Fspan>\n        <span style=\"display:block;font-family:var(--font-body);font-size:14px;line-height:1.45;color:var(--text-dim-dark);margin-top:3px\">Last one is a sprint. Get the lungs honest early.<\u002Fspan>\n      <\u002Fspan>\n      <b style=\"font-family:var(--font-num);font-size:19px;line-height:1.2;color:var(--fast-red);flex:none;padding-left:12px;white-space:nowrap\">4 REPS<\u002Fb>\n    <\u002Flabel>\n  <\u002Fdiv>\n\n  <div class=\"pk\" style=\"background:var(--ink-lift);border:1px solid var(--line-dark);border-radius:14px;padding:clamp(18px,2.4vw,26px)\">\n    <div style=\"display:flex;align-items:baseline;gap:12px;margin-bottom:2px\">\n      <b style=\"font-family:var(--font-num);font-size:26px;line-height:1;color:var(--fast-red)\">02<\u002Fb>\n      <h3 style=\"flex:1;font-family:var(--font-display);text-transform:uppercase;font-size:20px;line-height:1;letter-spacing:0.01em;color:var(--bone);margin:0\">Handle under pressure<\u002Fh3>\n      <span style=\"font-family:var(--font-eyebrow);font-weight:700;font-size:0.72rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--text-faint-dark)\">12 Min<\u002Fspan>\n    <\u002Fdiv>\n    <label style=\"display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n      <input type=\"checkbox\" data-k=\"d.6\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:2px 0 0;cursor:pointer\">\n      <span style=\"flex:1;min-width:0\">\n        <span style=\"display:block;font-family:var(--font-body);font-weight:600;font-size:16px;line-height:1.35;color:var(--bone)\">Attack and retreat, baseline to the free throw line<\u002Fspan>\n        <span style=\"display:block;font-family:var(--font-body);font-size:14px;line-height:1.45;color:var(--text-dim-dark);margin-top:3px\">Push out hard, pull back harder. The retreat is the drill.<\u002Fspan>\n      <\u002Fspan>\n      <b style=\"font-family:var(--font-num);font-size:19px;line-height:1.2;color:var(--fast-red);flex:none;padding-left:12px;white-space:nowrap\">6 REPS<\u002Fb>\n    <\u002Flabel>\n    <label style=\"display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n      <input type=\"checkbox\" data-k=\"d.7\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:2px 0 0;cursor:pointer\">\n      <span style=\"flex:1;min-width:0\">\n        <span style=\"display:block;font-family:var(--font-body);font-weight:600;font-size:16px;line-height:1.35;color:var(--bone)\">Snatch back into a burst<\u002Fspan>\n        <span style=\"display:block;font-family:var(--font-body);font-size:14px;line-height:1.45;color:var(--text-dim-dark);margin-top:3px\">Hip snap first, then go. No pause in between.<\u002Fspan>\n      <\u002Fspan>\n      <b style=\"font-family:var(--font-num);font-size:19px;line-height:1.2;color:var(--fast-red);flex:none;padding-left:12px;white-space:nowrap\">8 EA<\u002Fb>\n    <\u002Flabel>\n    <label style=\"display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n      <input type=\"checkbox\" data-k=\"d.8\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:2px 0 0;cursor:pointer\">\n      <span style=\"flex:1;min-width:0\">\n        <span style=\"display:block;font-family:var(--font-body);font-weight:600;font-size:16px;line-height:1.35;color:var(--bone)\">Cross, between, behind at full speed<\u002Fspan>\n        <span style=\"display:block;font-family:var(--font-body);font-size:14px;line-height:1.45;color:var(--text-dim-dark);margin-top:3px\">Three moves, no stutter between them.<\u002Fspan>\n      <\u002Fspan>\n      <b style=\"font-family:var(--font-num);font-size:19px;line-height:1.2;color:var(--fast-red);flex:none;padding-left:12px;white-space:nowrap\">3 x 20<\u002Fb>\n    <\u002Flabel>\n    <label style=\"display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n      <input type=\"checkbox\" data-k=\"d.9\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:2px 0 0;cursor:pointer\">\n      <span style=\"flex:1;min-width:0\">\n        <span style=\"display:block;font-family:var(--font-body);font-weight:600;font-size:16px;line-height:1.35;color:var(--bone)\">Weak hand only, other hand behind your back<\u002Fspan>\n        <span style=\"display:block;font-family:var(--font-body);font-size:14px;line-height:1.45;color:var(--text-dim-dark);margin-top:3px\">This is the one you will want to skip.<\u002Fspan>\n      <\u002Fspan>\n      <b style=\"font-family:var(--font-num);font-size:19px;line-height:1.2;color:var(--fast-red);flex:none;padding-left:12px;white-space:nowrap\">45 SEC<\u002Fb>\n    <\u002Flabel>\n    <label style=\"display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n      <input type=\"checkbox\" data-k=\"d.10\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:2px 0 0;cursor:pointer\">\n      <span style=\"flex:1;min-width:0\">\n        <span style=\"display:block;font-family:var(--font-body);font-weight:600;font-size:16px;line-height:1.35;color:var(--bone)\">Two-move counter to the rim<\u002Fspan>\n        <span style=\"display:block;font-family:var(--font-body);font-size:14px;line-height:1.45;color:var(--text-dim-dark);margin-top:3px\">Sell the first move or the second one is wasted.<\u002Fspan>\n      <\u002Fspan>\n      <b style=\"font-family:var(--font-num);font-size:19px;line-height:1.2;color:var(--fast-red);flex:none;padding-left:12px;white-space:nowrap\">10 REPS<\u002Fb>\n    <\u002Flabel>\n  <\u002Fdiv>\n\n  <div class=\"pk\" style=\"background:var(--ink-lift);border:1px solid var(--line-dark);border-radius:14px;padding:clamp(18px,2.4vw,26px)\">\n    <div style=\"display:flex;align-items:baseline;gap:12px;margin-bottom:2px\">\n      <b style=\"font-family:var(--font-num);font-size:26px;line-height:1;color:var(--fast-red)\">03<\u002Fb>\n      <h3 style=\"flex:1;font-family:var(--font-display);text-transform:uppercase;font-size:20px;line-height:1;letter-spacing:0.01em;color:var(--bone);margin:0\">Finish through contact<\u002Fh3>\n      <span style=\"font-family:var(--font-eyebrow);font-weight:700;font-size:0.72rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--text-faint-dark)\">12 Min<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"font-family:var(--font-body);font-size:14px;line-height:1.5;color:var(--text-dim-dark);margin:6px 0 4px;text-wrap:pretty\">No pads and no partner. The contact is the rim, the floor, and taking off from further out than is comfortable.<\u002Fp>\n    <label style=\"display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n      <input type=\"checkbox\" data-k=\"d.11\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:2px 0 0;cursor:pointer\">\n      <span style=\"flex:1;min-width:0\">\n        <span style=\"display:block;font-family:var(--font-body);font-weight:600;font-size:16px;line-height:1.35;color:var(--bone)\">Off-foot layups, both sides<\u002Fspan>\n        <span style=\"display:block;font-family:var(--font-body);font-size:14px;line-height:1.45;color:var(--text-dim-dark);margin-top:3px\">Wrong foot on purpose. College defenders take the right one away.<\u002Fspan>\n      <\u002Fspan>\n      <b style=\"font-family:var(--font-num);font-size:19px;line-height:1.2;color:var(--fast-red);flex:none;padding-left:12px;white-space:nowrap\">10 MAKES EA<\u002Fb>\n    <\u002Flabel>\n    <label style=\"display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n      <input type=\"checkbox\" data-k=\"d.12\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:2px 0 0;cursor:pointer\">\n      <span style=\"flex:1;min-width:0\">\n        <span style=\"display:block;font-family:var(--font-body);font-weight:600;font-size:16px;line-height:1.35;color:var(--bone)\">Inside hand, two-foot finish<\u002Fspan>\n        <span style=\"display:block;font-family:var(--font-body);font-size:14px;line-height:1.45;color:var(--text-dim-dark);margin-top:3px\">Land loaded, chin over the ball.<\u002Fspan>\n      <\u002Fspan>\n      <b style=\"font-family:var(--font-num);font-size:19px;line-height:1.2;color:var(--fast-red);flex:none;padding-left:12px;white-space:nowrap\">8 MAKES EA<\u002Fb>\n    <\u002Flabel>\n    <label style=\"display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n      <input type=\"checkbox\" data-k=\"d.13\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:2px 0 0;cursor:pointer\">\n      <span style=\"flex:1;min-width:0\">\n        <span style=\"display:block;font-family:var(--font-body);font-weight:600;font-size:16px;line-height:1.35;color:var(--bone)\">Euro step, decelerate, finish<\u002Fspan>\n        <span style=\"display:block;font-family:var(--font-body);font-size:14px;line-height:1.45;color:var(--text-dim-dark);margin-top:3px\">The stop is the move. Anybody can take two steps.<\u002Fspan>\n      <\u002Fspan>\n      <b style=\"font-family:var(--font-num);font-size:19px;line-height:1.2;color:var(--fast-red);flex:none;padding-left:12px;white-space:nowrap\">6 EA SIDE<\u002Fb>\n    <\u002Flabel>\n    <label style=\"display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n      <input type=\"checkbox\" data-k=\"d.14\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:2px 0 0;cursor:pointer\">\n      <span style=\"flex:1;min-width:0\">\n        <span style=\"display:block;font-family:var(--font-body);font-weight:600;font-size:16px;line-height:1.35;color:var(--bone)\">Finish on the second jump<\u002Fspan>\n        <span style=\"display:block;font-family:var(--font-body);font-size:14px;line-height:1.45;color:var(--text-dim-dark);margin-top:3px\">Rebound your own miss and go straight back up. No dribble.<\u002Fspan>\n      <\u002Fspan>\n      <b style=\"font-family:var(--font-num);font-size:19px;line-height:1.2;color:var(--fast-red);flex:none;padding-left:12px;white-space:nowrap\">10 MAKES<\u002Fb>\n    <\u002Flabel>\n  <\u002Fdiv>\n\n  <div class=\"pk\" style=\"background:var(--ink-lift);border:1px solid var(--line-dark);border-radius:14px;padding:clamp(18px,2.4vw,26px)\">\n    <div style=\"display:flex;align-items:baseline;gap:12px;margin-bottom:2px\">\n      <b style=\"font-family:var(--font-num);font-size:26px;line-height:1;color:var(--fast-red)\">04<\u002Fb>\n      <h3 style=\"flex:1;font-family:var(--font-display);text-transform:uppercase;font-size:20px;line-height:1;letter-spacing:0.01em;color:var(--bone);margin:0\">Shooting, in makes<\u002Fh3>\n      <span style=\"font-family:var(--font-eyebrow);font-weight:700;font-size:0.72rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--text-faint-dark)\">20 Min<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"font-family:var(--font-body);font-size:14px;line-height:1.5;color:var(--text-dim-dark);margin:6px 0 4px;text-wrap:pretty\">Makes, never attempts. A number you have to earn is the only number that changes anything.<\u002Fp>\n    <label style=\"display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n      <input type=\"checkbox\" data-k=\"d.15\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:2px 0 0;cursor:pointer\">\n      <span style=\"flex:1;min-width:0\">\n        <span style=\"display:block;font-family:var(--font-body);font-weight:600;font-size:16px;line-height:1.35;color:var(--bone)\">Form shooting, one hand, five spots<\u002Fspan>\n        <span style=\"display:block;font-family:var(--font-body);font-size:14px;line-height:1.45;color:var(--text-dim-dark);margin-top:3px\">Inside the paint. Guide hand off the ball entirely.<\u002Fspan>\n      <\u002Fspan>\n      <b style=\"font-family:var(--font-num);font-size:19px;line-height:1.2;color:var(--fast-red);flex:none;padding-left:12px;white-space:nowrap\">5 MAKES EA<\u002Fb>\n    <\u002Flabel>\n    <label style=\"display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n      <input type=\"checkbox\" data-k=\"d.16\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:2px 0 0;cursor:pointer\">\n      <span style=\"flex:1;min-width:0\">\n        <span style=\"display:block;font-family:var(--font-body);font-weight:600;font-size:16px;line-height:1.35;color:var(--bone)\">One-two into the shot, elbow to elbow<\u002Fspan>\n        <span style=\"display:block;font-family:var(--font-body);font-size:14px;line-height:1.45;color:var(--text-dim-dark);margin-top:3px\">Same footwork every time, both directions.<\u002Fspan>\n      <\u002Fspan>\n      <b style=\"font-family:var(--font-num);font-size:19px;line-height:1.2;color:var(--fast-red);flex:none;padding-left:12px;white-space:nowrap\">20 MAKES<\u002Fb>\n    <\u002Flabel>\n    <label style=\"display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n      <input type=\"checkbox\" data-k=\"d.17\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:2px 0 0;cursor:pointer\">\n      <span style=\"flex:1;min-width:0\">\n        <span style=\"display:block;font-family:var(--font-body);font-weight:600;font-size:16px;line-height:1.35;color:var(--bone)\">Off the catch, five spots<\u002Fspan>\n        <span style=\"display:block;font-family:var(--font-body);font-size:14px;line-height:1.45;color:var(--text-dim-dark);margin-top:3px\">Throw yourself a real pass. Feet set before it arrives.<\u002Fspan>\n      <\u002Fspan>\n      <b style=\"font-family:var(--font-num);font-size:19px;line-height:1.2;color:var(--fast-red);flex:none;padding-left:12px;white-space:nowrap\">8 MAKES EA<\u002Fb>\n    <\u002Flabel>\n    <label style=\"display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n      <input type=\"checkbox\" data-k=\"d.18\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:2px 0 0;cursor:pointer\">\n      <span style=\"flex:1;min-width:0\">\n        <span style=\"display:block;font-family:var(--font-body);font-weight:600;font-size:16px;line-height:1.35;color:var(--bone)\">One-dribble pull-up, both directions<\u002Fspan>\n        <span style=\"display:block;font-family:var(--font-body);font-size:14px;line-height:1.45;color:var(--text-dim-dark);margin-top:3px\">The shot that gets a guard recruited.<\u002Fspan>\n      <\u002Fspan>\n      <b style=\"font-family:var(--font-num);font-size:19px;line-height:1.2;color:var(--fast-red);flex:none;padding-left:12px;white-space:nowrap\">10 MAKES EA<\u002Fb>\n    <\u002Flabel>\n    <label style=\"display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n      <input type=\"checkbox\" data-k=\"d.19\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:2px 0 0;cursor:pointer\">\n      <span style=\"flex:1;min-width:0\">\n        <span style=\"display:block;font-family:var(--font-body);font-weight:600;font-size:16px;line-height:1.35;color:var(--bone)\">Deep two, game speed<\u002Fspan>\n        <span style=\"display:block;font-family:var(--font-body);font-size:14px;line-height:1.45;color:var(--text-dim-dark);margin-top:3px\">Tired legs, same arc. Count out loud.<\u002Fspan>\n      <\u002Fspan>\n      <b style=\"font-family:var(--font-num);font-size:19px;line-height:1.2;color:var(--fast-red);flex:none;padding-left:12px;white-space:nowrap\">15 MAKES<\u002Fb>\n    <\u002Flabel>\n  <\u002Fdiv>\n\n  <div class=\"pk\" style=\"background:var(--ink-lift);border:1px solid var(--line-dark);border-radius:14px;padding:clamp(18px,2.4vw,26px)\">\n    <div style=\"display:flex;align-items:baseline;gap:12px;margin-bottom:2px\">\n      <b style=\"font-family:var(--font-num);font-size:26px;line-height:1;color:var(--fast-red)\">05<\u002Fb>\n      <h3 style=\"flex:1;font-family:var(--font-display);text-transform:uppercase;font-size:20px;line-height:1;letter-spacing:0.01em;color:var(--bone);margin:0\">Close it out<\u002Fh3>\n      <span style=\"font-family:var(--font-eyebrow);font-weight:700;font-size:0.72rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--text-faint-dark)\">8 Min<\u002Fspan>\n    <\u002Fdiv>\n    <label style=\"display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n      <input type=\"checkbox\" data-k=\"d.20\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:2px 0 0;cursor:pointer\">\n      <span style=\"flex:1;min-width:0\">\n        <span style=\"display:block;font-family:var(--font-body);font-weight:600;font-size:16px;line-height:1.35;color:var(--bone)\">Free throws in pairs, full routine<\u002Fspan>\n        <span style=\"display:block;font-family:var(--font-body);font-size:14px;line-height:1.45;color:var(--text-dim-dark);margin-top:3px\">Same breath, same dribble count, every single time.<\u002Fspan>\n      <\u002Fspan>\n      <b style=\"font-family:var(--font-num);font-size:19px;line-height:1.2;color:var(--fast-red);flex:none;padding-left:12px;white-space:nowrap\">20 MAKES<\u002Fb>\n    <\u002Flabel>\n    <label style=\"display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n      <input type=\"checkbox\" data-k=\"d.21\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:2px 0 0;cursor:pointer\">\n      <span style=\"flex:1;min-width:0\">\n        <span style=\"display:block;font-family:var(--font-body);font-weight:600;font-size:16px;line-height:1.35;color:var(--bone)\">Last shot, game on the line<\u002Fspan>\n        <span style=\"display:block;font-family:var(--font-body);font-size:14px;line-height:1.45;color:var(--text-dim-dark);margin-top:3px\">Call the situation out loud before you shoot it.<\u002Fspan>\n      <\u002Fspan>\n      <b style=\"font-family:var(--font-num);font-size:19px;line-height:1.2;color:var(--fast-red);flex:none;padding-left:12px;white-space:nowrap\">1 MAKE<\u002Fb>\n    <\u002Flabel>\n    <div style=\"margin-top:16px;border-left:3px solid var(--fast-red);background:var(--red-tint);border-radius:0 10px 10px 0;padding:14px 18px\">\n      <p style=\"font-family:var(--font-body);font-weight:600;font-size:16px;line-height:1.5;color:var(--bone);margin:0;text-wrap:pretty\">Two free throws in a row to leave the gym. Miss one and the pair starts over.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"pk\" style=\"background:var(--ink-lift);border:1px solid var(--line-dark);border-radius:14px;padding:clamp(18px,2.4vw,26px)\">\n    <div style=\"display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))\">\n      <label>\n        <span style=\"display:block;font-family:var(--font-eyebrow);font-weight:700;font-size:0.7rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--text-label-dark);margin-bottom:8px\">The one thing I fixed today<\u002Fspan>\n        <input type=\"text\" data-k=\"d.fix\" style=\"width:100%;background:transparent;border:0;border-bottom:1.5px solid var(--line-dark);color:var(--bone);font-family:var(--font-body);font-size:16px;padding:8px 2px;min-height:42px\">\n      <\u002Flabel>\n      <label>\n        <span style=\"display:block;font-family:var(--font-eyebrow);font-weight:700;font-size:0.7rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--text-label-dark);margin-bottom:8px\">Tomorrow, first rep<\u002Fspan>\n        <input type=\"text\" data-k=\"d.next\" style=\"width:100%;background:transparent;border:0;border-bottom:1.5px solid var(--line-dark);color:var(--bone);font-family:var(--font-body);font-size:16px;padding:8px 2px;min-height:42px\">\n      <\u002Flabel>\n    <\u002Fdiv>\n    <p style=\"font-family:var(--font-display);text-transform:uppercase;font-size:clamp(1.3rem,3vw,1.9rem);line-height:1;letter-spacing:0.01em;color:var(--bone);margin:26px 0 0\">Win each practice. <span class=\"hollow\">Win each day.<\u002Fspan><\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"pk\" style=\"border-top:1px solid var(--line-dark);padding-top:22px;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap\">\n    <img class=\"np\" src=\"76cba028-514e-4c1e-b675-65b40bf3bc0a\" width=\"250\" height=\"106\" alt=\"Fast Basketball\" style=\"width:250px;height:auto\">\n    <img class=\"plogo\" src=\"752c4ea2-717f-46a3-bcbd-ee48ab74496b\" width=\"250\" height=\"106\" alt=\"Fast Basketball\" style=\"width:250px;height:auto;display:none\">\n    <div style=\"font-family:var(--font-body);font-size:14px;line-height:1.7;color:var(--text-faint-dark);text-align:right\">\n      <div>fastbasketball.com<\u002Fdiv>\n      <div>[coach@fastbasketball.com] · [(954) 000-0000]<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Farticle>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isBlock }}\" hint-placeholder-val=\"{{ false }}\">\n<article data-screen-label=\"4-Week Block\" style=\"display:grid;gap:16px;animation:fbRise var(--t-reveal) var(--ease-rush) both\">\n\n  <div class=\"pk\" style=\"background:var(--ink-lift);border:1px solid var(--line-dark);border-radius:18px;padding:clamp(20px,3vw,34px)\">\n    <div style=\"display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px\">\n      <span class=\"eyebrow\" style=\"color:var(--bone)\">4-Week Block<\u002Fspan>\n    <\u002Fdiv>\n    <h1 style=\"font-family:var(--font-display);text-transform:uppercase;font-size:clamp(2.1rem,5.4vw,3.4rem);line-height:0.94;letter-spacing:0.01em;color:var(--bone);margin:0 0 16px\">Four weeks. <span class=\"hollow\">One handle.<\u002Fspan><\u002Fh1>\n    <p style=\"font-family:var(--font-body);font-size:var(--text-lede);line-height:1.6;color:var(--text-lede-dark);max-width:62ch;margin:0;text-wrap:pretty\">Four sessions a week for four weeks. You test on day one and you test again on day twenty-eight. The numbers say whether the work was real.<\u002Fp>\n    <div style=\"display:flex;gap:16px;flex-wrap:wrap;margin-top:24px\">\n      <label style=\"flex:1 1 180px;min-width:150px\">\n        <span style=\"display:block;font-family:var(--font-eyebrow);font-weight:700;font-size:0.7rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--text-label-dark);margin-bottom:6px\">Player<\u002Fspan>\n        <input type=\"text\" data-k=\"b.player\" style=\"width:100%;background:transparent;border:0;border-bottom:1.5px solid var(--line-dark);color:var(--bone);font-family:var(--font-body);font-size:16px;padding:7px 2px;min-height:40px\">\n      <\u002Flabel>\n      <label style=\"flex:1 1 140px;min-width:130px\">\n        <span style=\"display:block;font-family:var(--font-eyebrow);font-weight:700;font-size:0.7rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--text-label-dark);margin-bottom:6px\">Block starts<\u002Fspan>\n        <input type=\"text\" data-k=\"b.start\" style=\"width:100%;background:transparent;border:0;border-bottom:1.5px solid var(--line-dark);color:var(--bone);font-family:var(--font-body);font-size:16px;padding:7px 2px;min-height:40px\">\n      <\u002Flabel>\n      <label style=\"flex:1 1 140px;min-width:130px\">\n        <span style=\"display:block;font-family:var(--font-eyebrow);font-weight:700;font-size:0.7rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--text-label-dark);margin-bottom:6px\">Retest on<\u002Fspan>\n        <input type=\"text\" data-k=\"b.retest\" style=\"width:100%;background:transparent;border:0;border-bottom:1.5px solid var(--line-dark);color:var(--bone);font-family:var(--font-body);font-size:16px;padding:7px 2px;min-height:40px\">\n      <\u002Flabel>\n    <\u002Fdiv>\n    <p class=\"np\" style=\"font-family:var(--font-body);font-size:0.8rem;color:var(--text-faint-dark);margin:18px 0 0\">{{ doneLabel }} · Ticks save on this device.<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"pk\" style=\"background:var(--ink-lift);border:1px solid var(--line-dark);border-radius:14px;padding:clamp(18px,2.4vw,26px)\">\n    <div style=\"display:flex;align-items:baseline;gap:12px;margin-bottom:8px\">\n      <h3 style=\"flex:1;font-family:var(--font-display);text-transform:uppercase;font-size:20px;line-height:1;letter-spacing:0.01em;color:var(--bone);margin:0\">Day one baseline<\u002Fh3>\n      <span style=\"font-family:var(--font-eyebrow);font-weight:700;font-size:0.72rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--text-faint-dark)\">Write it down<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"font-family:var(--font-body);font-size:14px;line-height:1.5;color:var(--text-dim-dark);margin:0 0 6px;text-wrap:pretty\">Do these cold, before session one. A bad baseline is fine. A missing one wastes the whole block.<\u002Fp>\n    <div style=\"display:flex;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line-dark)\">\n      <span style=\"flex:1;font-family:var(--font-body);font-weight:600;font-size:16px;color:var(--bone)\">Pound dribble in sixty seconds<\u002Fspan>\n      <input type=\"text\" data-k=\"b.base1\" style=\"width:88px;background:transparent;border:0;border-bottom:1.5px solid var(--red-line);color:var(--fast-red);font-family:var(--font-num);font-size:20px;text-align:center;padding:4px 2px;min-height:40px\">\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line-dark)\">\n      <span style=\"flex:1;font-family:var(--font-body);font-weight:600;font-size:16px;color:var(--bone)\">Attack and retreat reps in thirty seconds<\u002Fspan>\n      <input type=\"text\" data-k=\"b.base2\" style=\"width:88px;background:transparent;border:0;border-bottom:1.5px solid var(--red-line);color:var(--fast-red);font-family:var(--font-num);font-size:20px;text-align:center;padding:4px 2px;min-height:40px\">\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line-dark)\">\n      <span style=\"flex:1;font-family:var(--font-body);font-weight:600;font-size:16px;color:var(--bone)\">Two-move counter finishes, out of 20<\u002Fspan>\n      <input type=\"text\" data-k=\"b.base3\" style=\"width:88px;background:transparent;border:0;border-bottom:1.5px solid var(--red-line);color:var(--fast-red);font-family:var(--font-num);font-size:20px;text-align:center;padding:4px 2px;min-height:40px\">\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line-dark)\">\n      <span style=\"flex:1;font-family:var(--font-body);font-weight:600;font-size:16px;color:var(--bone)\">Pull-up jumpers made, out of 20<\u002Fspan>\n      <input type=\"text\" data-k=\"b.base4\" style=\"width:88px;background:transparent;border:0;border-bottom:1.5px solid var(--red-line);color:var(--fast-red);font-family:var(--font-num);font-size:20px;text-align:center;padding:4px 2px;min-height:40px\">\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line-dark)\">\n      <span style=\"flex:1;font-family:var(--font-body);font-weight:600;font-size:16px;color:var(--bone)\">Free throws made, out of 25<\u002Fspan>\n      <input type=\"text\" data-k=\"b.base5\" style=\"width:88px;background:transparent;border:0;border-bottom:1.5px solid var(--red-line);color:var(--fast-red);font-family:var(--font-num);font-size:20px;text-align:center;padding:4px 2px;min-height:40px\">\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"pk\" style=\"background:var(--ink-lift);border:1px solid var(--line-dark);border-radius:14px;padding:clamp(18px,2.4vw,26px)\">\n    <div style=\"display:flex;align-items:baseline;gap:12px;flex-wrap:wrap\">\n      <b style=\"font-family:var(--font-num);font-size:26px;line-height:1;color:var(--fast-red)\">WEEK 01<\u002Fb>\n      <h3 style=\"flex:1;font-family:var(--font-display);text-transform:uppercase;font-size:20px;line-height:1;letter-spacing:0.01em;color:var(--bone);margin:0\">Control<\u002Fh3>\n      <span style=\"font-family:var(--font-eyebrow);font-weight:700;font-size:0.72rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--text-faint-dark)\">4 Sessions · 40 Min<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"font-family:var(--font-body);font-size:15px;line-height:1.55;color:var(--text-body-dark);margin:10px 0 4px;text-wrap:pretty\">Slow is the point. Every rep at a height and a speed you can repeat exactly. If the ball gets loud and sloppy, the set is over.<\u002Fp>\n    <div style=\"display:grid;gap:0;margin-top:6px\">\n      <label style=\"display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n        <input type=\"checkbox\" data-k=\"b.w1s1\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:2px 0 0;cursor:pointer\">\n        <span style=\"flex:1;font-family:var(--font-body);font-weight:600;font-size:16px;line-height:1.35;color:var(--bone)\">Session 1 · Ball prep and the pound ladder<\u002Fspan>\n      <\u002Flabel>\n      <label style=\"display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n        <input type=\"checkbox\" data-k=\"b.w1s2\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:2px 0 0;cursor:pointer\">\n        <span style=\"flex:1;font-family:var(--font-body);font-weight:600;font-size:16px;line-height:1.35;color:var(--bone)\">Session 2 · Two-move counters, walking pace<\u002Fspan>\n      <\u002Flabel>\n      <label style=\"display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n        <input type=\"checkbox\" data-k=\"b.w1s3\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:2px 0 0;cursor:pointer\">\n        <span style=\"flex:1;font-family:var(--font-body);font-weight:600;font-size:16px;line-height:1.35;color:var(--bone)\">Session 3 · Full-court control, both hands<\u002Fspan>\n      <\u002Flabel>\n      <label style=\"display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n        <input type=\"checkbox\" data-k=\"b.w1s4\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:2px 0 0;cursor:pointer\">\n        <span style=\"flex:1;font-family:var(--font-body);font-weight:600;font-size:16px;line-height:1.35;color:var(--bone)\">Session 4 · Free throws and a phone-camera rep<\u002Fspan>\n      <\u002Flabel>\n    <\u002Fdiv>\n    <p style=\"font-family:var(--font-body);font-size:14px;line-height:1.5;color:var(--text-dim-dark);margin:14px 0 0\"><b style=\"color:var(--fast-red);font-family:var(--font-eyebrow);letter-spacing:0.14em;text-transform:uppercase;font-size:0.72rem\">Do not skip<\u002Fb> &nbsp;Film one minute of session four on a phone. You will need it in week four.<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"pk\" style=\"background:var(--ink-lift);border:1px solid var(--line-dark);border-radius:14px;padding:clamp(18px,2.4vw,26px)\">\n    <div style=\"display:flex;align-items:baseline;gap:12px;flex-wrap:wrap\">\n      <b style=\"font-family:var(--font-num);font-size:26px;line-height:1;color:var(--fast-red)\">WEEK 02<\u002Fb>\n      <h3 style=\"flex:1;font-family:var(--font-display);text-transform:uppercase;font-size:20px;line-height:1;letter-spacing:0.01em;color:var(--bone);margin:0\">Speed<\u002Fh3>\n      <span style=\"font-family:var(--font-eyebrow);font-weight:700;font-size:0.72rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--text-faint-dark)\">4 Sessions · 45 Min<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"font-family:var(--font-body);font-size:15px;line-height:1.55;color:var(--text-body-dark);margin:10px 0 4px;text-wrap:pretty\">Same reps as week one, run at a speed that scares you slightly. Timed sets now. Write the number down or the set did not happen.<\u002Fp>\n    <div style=\"display:grid;gap:0;margin-top:6px\">\n      <label style=\"display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n        <input type=\"checkbox\" data-k=\"b.w2s1\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:2px 0 0;cursor:pointer\">\n        <span style=\"flex:1;font-family:var(--font-body);font-weight:600;font-size:16px;line-height:1.35;color:var(--bone)\">Session 1 · Timed pound ladder, thirty-second blocks<\u002Fspan>\n      <\u002Flabel>\n      <label style=\"display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n        <input type=\"checkbox\" data-k=\"b.w2s2\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:2px 0 0;cursor:pointer\">\n        <span style=\"flex:1;font-family:var(--font-body);font-weight:600;font-size:16px;line-height:1.35;color:var(--bone)\">Session 2 · Snatch back into a burst, full court<\u002Fspan>\n      <\u002Flabel>\n      <label style=\"display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n        <input type=\"checkbox\" data-k=\"b.w2s3\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:2px 0 0;cursor:pointer\">\n        <span style=\"flex:1;font-family:var(--font-body);font-weight:600;font-size:16px;line-height:1.35;color:var(--bone)\">Session 3 · Counters into a finish, both sides<\u002Fspan>\n      <\u002Flabel>\n      <label style=\"display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n        <input type=\"checkbox\" data-k=\"b.w2s4\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:2px 0 0;cursor:pointer\">\n        <span style=\"flex:1;font-family:var(--font-body);font-weight:600;font-size:16px;line-height:1.35;color:var(--bone)\">Session 4 · Pull-up jumpers off the handle work<\u002Fspan>\n      <\u002Flabel>\n    <\u002Fdiv>\n    <p style=\"font-family:var(--font-body);font-size:14px;line-height:1.5;color:var(--text-dim-dark);margin:14px 0 0\"><b style=\"color:var(--fast-red);font-family:var(--font-eyebrow);letter-spacing:0.14em;text-transform:uppercase;font-size:0.72rem\">Do not skip<\u002Fb> &nbsp;One full rest day this week. Growth happens on the day off.<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"pk\" style=\"background:var(--ink-lift);border:1px solid var(--line-dark);border-radius:14px;padding:clamp(18px,2.4vw,26px)\">\n    <div style=\"display:flex;align-items:baseline;gap:12px;flex-wrap:wrap\">\n      <b style=\"font-family:var(--font-num);font-size:26px;line-height:1;color:var(--fast-red)\">WEEK 03<\u002Fb>\n      <h3 style=\"flex:1;font-family:var(--font-display);text-transform:uppercase;font-size:20px;line-height:1;letter-spacing:0.01em;color:var(--bone);margin:0\">Pressure<\u002Fh3>\n      <span style=\"font-family:var(--font-eyebrow);font-weight:700;font-size:0.72rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--text-faint-dark)\">4 Sessions · 45 Min<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"font-family:var(--font-body);font-size:15px;line-height:1.55;color:var(--text-body-dark);margin:10px 0 4px;text-wrap:pretty\">Every set now ends in a shot you have to make, or the set repeats. Tired legs and a real consequence. That is the week.<\u002Fp>\n    <div style=\"display:grid;gap:0;margin-top:6px\">\n      <label style=\"display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n        <input type=\"checkbox\" data-k=\"b.w3s1\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:2px 0 0;cursor:pointer\">\n        <span style=\"flex:1;font-family:var(--font-body);font-weight:600;font-size:16px;line-height:1.35;color:var(--bone)\">Session 1 · Handle set, then five makes to leave the spot<\u002Fspan>\n      <\u002Flabel>\n      <label style=\"display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n        <input type=\"checkbox\" data-k=\"b.w3s2\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:2px 0 0;cursor:pointer\">\n        <span style=\"flex:1;font-family:var(--font-body);font-weight:600;font-size:16px;line-height:1.35;color:var(--bone)\">Session 2 · Sprint, then finish with the off hand<\u002Fspan>\n      <\u002Flabel>\n      <label style=\"display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n        <input type=\"checkbox\" data-k=\"b.w3s3\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:2px 0 0;cursor:pointer\">\n        <span style=\"flex:1;font-family:var(--font-body);font-weight:600;font-size:16px;line-height:1.35;color:var(--bone)\">Session 3 · Two minutes on the clock, count the makes<\u002Fspan>\n      <\u002Flabel>\n      <label style=\"display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n        <input type=\"checkbox\" data-k=\"b.w3s4\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:2px 0 0;cursor:pointer\">\n        <span style=\"flex:1;font-family:var(--font-body);font-weight:600;font-size:16px;line-height:1.35;color:var(--bone)\">Session 4 · Free throws between every set, in pairs<\u002Fspan>\n      <\u002Flabel>\n    <\u002Fdiv>\n    <p style=\"font-family:var(--font-body);font-size:14px;line-height:1.5;color:var(--text-dim-dark);margin:14px 0 0\"><b style=\"color:var(--fast-red);font-family:var(--font-eyebrow);letter-spacing:0.14em;text-transform:uppercase;font-size:0.72rem\">Do not skip<\u002Fb> &nbsp;Sleep. Week three is where tired players get careless and hurt.<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"pk\" style=\"background:var(--ink-lift);border:1px solid var(--red-line);border-radius:14px;padding:clamp(18px,2.4vw,26px)\">\n    <div style=\"display:flex;align-items:baseline;gap:12px;flex-wrap:wrap\">\n      <b style=\"font-family:var(--font-num);font-size:26px;line-height:1;color:var(--fast-red)\">WEEK 04<\u002Fb>\n      <h3 style=\"flex:1;font-family:var(--font-display);text-transform:uppercase;font-size:20px;line-height:1;letter-spacing:0.01em;color:var(--bone);margin:0\">Retest<\u002Fh3>\n      <span style=\"font-family:var(--font-eyebrow);font-weight:700;font-size:0.72rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--text-faint-dark)\">3 Sessions + Test<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"font-family:var(--font-body);font-size:15px;line-height:1.55;color:var(--text-body-dark);margin:10px 0 4px;text-wrap:pretty\">Three lighter sessions, then the same five tests you took on day one. Same court, same order, no warm-up advantage.<\u002Fp>\n    <div style=\"display:grid;gap:0;margin-top:6px\">\n      <label style=\"display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n        <input type=\"checkbox\" data-k=\"b.w4s1\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:2px 0 0;cursor:pointer\">\n        <span style=\"flex:1;font-family:var(--font-body);font-weight:600;font-size:16px;line-height:1.35;color:var(--bone)\">Session 1 · Sharpen, do not add anything new<\u002Fspan>\n      <\u002Flabel>\n      <label style=\"display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n        <input type=\"checkbox\" data-k=\"b.w4s2\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:2px 0 0;cursor:pointer\">\n        <span style=\"flex:1;font-family:var(--font-body);font-weight:600;font-size:16px;line-height:1.35;color:var(--bone)\">Session 2 · Shooting only, legs fresh<\u002Fspan>\n      <\u002Flabel>\n      <label style=\"display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n        <input type=\"checkbox\" data-k=\"b.w4s3\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:2px 0 0;cursor:pointer\">\n        <span style=\"flex:1;font-family:var(--font-body);font-weight:600;font-size:16px;line-height:1.35;color:var(--bone)\">Session 3 · Watch the week-one film, then go shoot<\u002Fspan>\n      <\u002Flabel>\n      <label style=\"display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n        <input type=\"checkbox\" data-k=\"b.w4s4\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:2px 0 0;cursor:pointer\">\n        <span style=\"flex:1;font-family:var(--font-body);font-weight:600;font-size:16px;line-height:1.35;color:var(--bone)\">Retest day · All five tests, in order<\u002Fspan>\n      <\u002Flabel>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"pk\" style=\"background:var(--ink-lift);border:1px solid var(--line-dark);border-radius:14px;padding:clamp(18px,2.4vw,26px)\">\n    <h3 style=\"font-family:var(--font-display);text-transform:uppercase;font-size:20px;line-height:1;letter-spacing:0.01em;color:var(--bone);margin:0 0 12px\">Retest scorecard<\u002Fh3>\n    <div style=\"display:flex;gap:12px;padding:0 0 8px;border-bottom:1px solid var(--line-dark)\">\n      <span style=\"flex:1;font-family:var(--font-eyebrow);font-weight:700;font-size:0.7rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--text-label-dark)\">Test<\u002Fspan>\n      <span style=\"width:80px;text-align:center;font-family:var(--font-eyebrow);font-weight:700;font-size:0.7rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--text-label-dark)\">Day 1<\u002Fspan>\n      <span style=\"width:80px;text-align:center;font-family:var(--font-eyebrow);font-weight:700;font-size:0.7rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--text-label-dark)\">Day 28<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-dark)\">\n      <span style=\"flex:1;font-family:var(--font-body);font-size:15px;color:var(--text-body-dark)\">Pound dribble in sixty seconds<\u002Fspan>\n      <input type=\"text\" data-k=\"b.r1a\" style=\"width:80px;background:transparent;border:0;border-bottom:1.5px solid var(--line-dark);color:var(--text-dim-dark);font-family:var(--font-num);font-size:19px;text-align:center;padding:4px 2px;min-height:38px\">\n      <input type=\"text\" data-k=\"b.r1b\" style=\"width:80px;background:transparent;border:0;border-bottom:1.5px solid var(--red-line);color:var(--fast-red);font-family:var(--font-num);font-size:19px;text-align:center;padding:4px 2px;min-height:38px\">\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-dark)\">\n      <span style=\"flex:1;font-family:var(--font-body);font-size:15px;color:var(--text-body-dark)\">Attack and retreat in thirty seconds<\u002Fspan>\n      <input type=\"text\" data-k=\"b.r2a\" style=\"width:80px;background:transparent;border:0;border-bottom:1.5px solid var(--line-dark);color:var(--text-dim-dark);font-family:var(--font-num);font-size:19px;text-align:center;padding:4px 2px;min-height:38px\">\n      <input type=\"text\" data-k=\"b.r2b\" style=\"width:80px;background:transparent;border:0;border-bottom:1.5px solid var(--red-line);color:var(--fast-red);font-family:var(--font-num);font-size:19px;text-align:center;padding:4px 2px;min-height:38px\">\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-dark)\">\n      <span style=\"flex:1;font-family:var(--font-body);font-size:15px;color:var(--text-body-dark)\">Two-move counter finishes, out of 20<\u002Fspan>\n      <input type=\"text\" data-k=\"b.r3a\" style=\"width:80px;background:transparent;border:0;border-bottom:1.5px solid var(--line-dark);color:var(--text-dim-dark);font-family:var(--font-num);font-size:19px;text-align:center;padding:4px 2px;min-height:38px\">\n      <input type=\"text\" data-k=\"b.r3b\" style=\"width:80px;background:transparent;border:0;border-bottom:1.5px solid var(--red-line);color:var(--fast-red);font-family:var(--font-num);font-size:19px;text-align:center;padding:4px 2px;min-height:38px\">\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-dark)\">\n      <span style=\"flex:1;font-family:var(--font-body);font-size:15px;color:var(--text-body-dark)\">Pull-up jumpers made, out of 20<\u002Fspan>\n      <input type=\"text\" data-k=\"b.r4a\" style=\"width:80px;background:transparent;border:0;border-bottom:1.5px solid var(--line-dark);co
