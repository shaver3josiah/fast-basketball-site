lor:var(--text-dim-dark);font-family:var(--font-num);font-size:19px;text-align:center;padding:4px 2px;min-height:38px\">\n      <input type=\"text\" data-k=\"b.r4b\" style=\"width:80px;background:transparent;border:0;border-bottom:1.5px solid var(--red-line);color:var(--fast-red);font-family:var(--font-num);font-size:19px;text-align:center;padding:4px 2px;min-height:38px\">\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:12px;align-items:center;padding:10px 0\">\n      <span style=\"flex:1;font-family:var(--font-body);font-size:15px;color:var(--text-body-dark)\">Free throws made, out of 25<\u002Fspan>\n      <input type=\"text\" data-k=\"b.r5a\" style=\"width:80px;background:transparent;border:0;border-bottom:1.5px solid var(--line-dark);color:var(--text-dim-dark);font-family:var(--font-num);font-size:19px;text-align:center;padding:4px 2px;min-height:38px\">\n      <input type=\"text\" data-k=\"b.r5b\" style=\"width:80px;background:transparent;border:0;border-bottom:1.5px solid var(--red-line);color:var(--fast-red);font-family:var(--font-num);font-size:19px;text-align:center;padding:4px 2px;min-height:38px\">\n    <\u002Fdiv>\n    <div style=\"margin-top:16px;border-left:3px solid var(--fast-red);background:var(--red-tint);border-radius:0 10px 10px 0;padding:14px 18px\">\n      <p style=\"font-family:var(--font-body);font-weight:600;font-size:16px;line-height:1.5;color:var(--bone);margin:0;text-wrap:pretty\">Bring this sheet to your next session. Coach Blake reads the numbers before he watches you play.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"pk\" style=\"border-top:1px solid var(--line-dark);padding-top:22px;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap\">\n    <img class=\"np\" src=\"76cba028-514e-4c1e-b675-65b40bf3bc0a\" width=\"250\" height=\"106\" alt=\"Fast Basketball\" style=\"width:250px;height:auto\">\n    <img class=\"plogo\" src=\"752c4ea2-717f-46a3-bcbd-ee48ab74496b\" width=\"250\" height=\"106\" alt=\"Fast Basketball\" style=\"width:250px;height:auto;display:none\">\n    <div style=\"font-family:var(--font-body);font-size:14px;line-height:1.7;color:var(--text-faint-dark);text-align:right\">\n      <div>fastbasketball.com<\u002Fdiv>\n      <div>[coach@fastbasketball.com] · [(954) 000-0000]<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Farticle>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isFuel }}\" hint-placeholder-val=\"{{ false }}\">\n<article data-screen-label=\"Game-Day Fuel\" style=\"display:grid;gap:16px;animation:fbRise var(--t-reveal) var(--ease-rush) both\">\n\n  <div class=\"pk\" style=\"background:var(--ink-lift);border:1px solid var(--line-dark);border-radius:18px;padding:clamp(20px,3vw,34px)\">\n    <div style=\"display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px\">\n      <span class=\"eyebrow\" style=\"color:var(--bone)\">Game-Day Fuel<\u002Fspan>\n    <\u002Fdiv>\n    <h1 style=\"font-family:var(--font-display);text-transform:uppercase;font-size:clamp(2.1rem,5.4vw,3.4rem);line-height:0.94;letter-spacing:0.01em;color:var(--bone);margin:0 0 16px\">Eat like the game <span class=\"hollow\">matters.<\u002Fspan><\u002Fh1>\n    <p style=\"font-family:var(--font-body);font-size:var(--text-lede);line-height:1.6;color:var(--text-lede-dark);max-width:62ch;margin:0;text-wrap:pretty\">This is how Coach Blake ate on game day, and what he watched work at the college level. Habits, not a prescription. Players tick the left column. Parents run the right one.<\u002Fp>\n    <p style=\"font-family:var(--font-body);font-size:14px;line-height:1.55;color:var(--text-faint-dark);max-width:62ch;margin:16px 0 0;text-wrap:pretty\">Nothing here is medical advice. Allergies, medical conditions, or anything to do with weight belong to a doctor or a registered dietitian, not a coach.<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"pk\" style=\"background:var(--ink-lift);border:1px solid var(--red-line);border-radius:14px;padding:clamp(18px,2.4vw,26px)\">\n    <h3 style=\"font-family:var(--font-display);text-transform:uppercase;font-size:20px;line-height:1;letter-spacing:0.01em;color:var(--bone);margin:0 0 14px\">The three rules<\u002Fh3>\n    <div style=\"display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))\">\n      <div style=\"border-top:2px solid var(--fast-red);padding-top:12px\">\n        <b style=\"display:block;font-family:var(--font-num);font-size:24px;color:var(--fast-red);line-height:1\">01<\u002Fb>\n        <p style=\"font-family:var(--font-body);font-weight:600;font-size:16px;line-height:1.45;color:var(--bone);margin:6px 0 0;text-wrap:pretty\">Water starts yesterday. You cannot catch up on game day.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border-top:2px solid var(--fast-red);padding-top:12px\">\n        <b style=\"display:block;font-family:var(--font-num);font-size:24px;color:var(--fast-red);line-height:1\">02<\u002Fb>\n        <p style=\"font-family:var(--font-body);font-weight:600;font-size:16px;line-height:1.45;color:var(--bone);margin:6px 0 0;text-wrap:pretty\">Nothing new on game day. Not a drink, not a bar, not a gas station sandwich.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border-top:2px solid var(--fast-red);padding-top:12px\">\n        <b style=\"display:block;font-family:var(--font-num);font-size:24px;color:var(--fast-red);line-height:1\">03<\u002Fb>\n        <p style=\"font-family:var(--font-body);font-weight:600;font-size:16px;line-height:1.45;color:var(--bone);margin:6px 0 0;text-wrap:pretty\">Something in the tank inside thirty minutes of the final buzzer.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"pk\" style=\"background:var(--ink-lift);border:1px solid var(--line-dark);border-radius:14px;padding:clamp(18px,2.4vw,26px)\">\n    <div style=\"display:flex;align-items:baseline;gap:12px;margin-bottom:12px\">\n      <h3 style=\"flex:1;font-family:var(--font-display);text-transform:uppercase;font-size:20px;line-height:1;letter-spacing:0.01em;color:var(--bone);margin:0\">The night before<\u002Fh3>\n      <span style=\"font-family:var(--font-eyebrow);font-weight:700;font-size:0.72rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--text-faint-dark)\">T minus 18 hours<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))\">\n      <div>\n        <div style=\"font-family:var(--font-eyebrow);font-weight:700;font-size:0.7rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--fast-red);margin-bottom:6px\">Player<\u002Fdiv>\n        <label style=\"display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n          <input type=\"checkbox\" data-k=\"f.1\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:1px 0 0;cursor:pointer\">\n          <span style=\"flex:1;font-family:var(--font-body);font-size:16px;line-height:1.4;color:var(--bone)\">Eat the dinner you always eat. Tonight is not the night to try something.<\u002Fspan>\n        <\u002Flabel>\n        <label style=\"display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n          <input type=\"checkbox\" data-k=\"f.2\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:1px 0 0;cursor:pointer\">\n          <span style=\"flex:1;font-family:var(--font-body);font-size:16px;line-height:1.4;color:var(--bone)\">Fill the bottle and put it by the door with your bag.<\u002Fspan>\n        <\u002Flabel>\n        <label style=\"display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n          <input type=\"checkbox\" data-k=\"f.3\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:1px 0 0;cursor:pointer\">\n          <span style=\"flex:1;font-family:var(--font-body);font-size:16px;line-height:1.4;color:var(--bone)\">Phone down early. Sleep is the cheapest advantage you will ever get.<\u002Fspan>\n        <\u002Flabel>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family:var(--font-eyebrow);font-weight:700;font-size:0.7rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--text-label-dark);margin-bottom:6px\">Parent<\u002Fdiv>\n        <p style=\"font-family:var(--font-body);font-size:15px;line-height:1.55;color:var(--text-body-dark);margin:0 0 8px;padding-top:9px;border-top:1px solid var(--line-dark);text-wrap:pretty\">Cook the familiar one. Rice, pasta, chicken, something they have eaten before a hundred games.<\u002Fp>\n        <p style=\"font-family:var(--font-body);font-size:15px;line-height:1.55;color:var(--text-body-dark);margin:0;padding-top:9px;border-top:1px solid var(--line-dark);text-wrap:pretty\">Check the bag tonight so nobody is hunting for a jersey in the morning.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"pk\" style=\"background:var(--ink-lift);border:1px solid var(--line-dark);border-radius:14px;padding:clamp(18px,2.4vw,26px)\">\n    <div style=\"display:flex;align-items:baseline;gap:12px;margin-bottom:12px\">\n      <h3 style=\"flex:1;font-family:var(--font-display);text-transform:uppercase;font-size:20px;line-height:1;letter-spacing:0.01em;color:var(--bone);margin:0\">Three hours out<\u002Fh3>\n      <span style=\"font-family:var(--font-eyebrow);font-weight:700;font-size:0.72rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--text-faint-dark)\">The real meal<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))\">\n      <div>\n        <div style=\"font-family:var(--font-eyebrow);font-weight:700;font-size:0.7rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--fast-red);margin-bottom:6px\">Player<\u002Fdiv>\n        <label style=\"display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n          <input type=\"checkbox\" data-k=\"f.4\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:1px 0 0;cursor:pointer\">\n          <span style=\"flex:1;font-family:var(--font-body);font-size:16px;line-height:1.4;color:var(--bone)\">A carb you recognise plus a protein. Rice and chicken. Pasta and turkey.<\u002Fspan>\n        <\u002Flabel>\n        <label style=\"display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n          <input type=\"checkbox\" data-k=\"f.5\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:1px 0 0;cursor:pointer\">\n          <span style=\"flex:1;font-family:var(--font-body);font-size:16px;line-height:1.4;color:var(--bone)\">Skip the fried side. Heavy grease sits in your legs at tip.<\u002Fspan>\n        <\u002Flabel>\n        <label style=\"display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n          <input type=\"checkbox\" data-k=\"f.6\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:1px 0 0;cursor:pointer\">\n          <span style=\"flex:1;font-family:var(--font-body);font-size:16px;line-height:1.4;color:var(--bone)\">Water with the meal. Keep the bottle moving all afternoon.<\u002Fspan>\n        <\u002Flabel>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family:var(--font-eyebrow);font-weight:700;font-size:0.7rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--text-label-dark);margin-bottom:6px\">Parent<\u002Fdiv>\n        <p style=\"font-family:var(--font-body);font-size:15px;line-height:1.55;color:var(--text-body-dark);margin:0 0 8px;padding-top:9px;border-top:1px solid var(--line-dark);text-wrap:pretty\">Eat early enough that this is a meal, not a scramble in the car park.<\u002Fp>\n        <p style=\"font-family:var(--font-body);font-size:15px;line-height:1.55;color:var(--text-body-dark);margin:0;padding-top:9px;border-top:1px solid var(--line-dark);text-wrap:pretty\">Pack the after-game food now. After the buzzer, nothing is open.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"pk\" style=\"background:var(--ink-lift);border:1px solid var(--line-dark);border-radius:14px;padding:clamp(18px,2.4vw,26px)\">\n    <div style=\"display:flex;align-items:baseline;gap:12px;margin-bottom:12px\">\n      <h3 style=\"flex:1;font-family:var(--font-display);text-transform:uppercase;font-size:20px;line-height:1;letter-spacing:0.01em;color:var(--bone);margin:0\">Ninety and forty-five minutes out<\u002Fh3>\n      <span style=\"font-family:var(--font-eyebrow);font-weight:700;font-size:0.72rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--text-faint-dark)\">Top up, do not load<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))\">\n      <div>\n        <div style=\"font-family:var(--font-eyebrow);font-weight:700;font-size:0.7rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--fast-red);margin-bottom:6px\">Player<\u002Fdiv>\n        <label style=\"display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n          <input type=\"checkbox\" data-k=\"f.7\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:1px 0 0;cursor:pointer\">\n          <span style=\"flex:1;font-family:var(--font-body);font-size:16px;line-height:1.4;color:var(--bone)\">Ninety out: something small and simple. A banana, toast, oatmeal.<\u002Fspan>\n        <\u002Flabel>\n        <label style=\"display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n          <input type=\"checkbox\" data-k=\"f.8\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:1px 0 0;cursor:pointer\">\n          <span style=\"flex:1;font-family:var(--font-body);font-size:16px;line-height:1.4;color:var(--bone)\">Forty-five out: water only, unless you are genuinely hungry.<\u002Fspan>\n        <\u002Flabel>\n        <label style=\"display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n          <input type=\"checkbox\" data-k=\"f.9\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:1px 0 0;cursor:pointer\">\n          <span style=\"flex:1;font-family:var(--font-body);font-size:16px;line-height:1.4;color:var(--bone)\">Warm-up starts on time. Food is not a reason to be late to the floor.<\u002Fspan>\n        <\u002Flabel>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family:var(--font-eyebrow);font-weight:700;font-size:0.7rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--text-label-dark);margin-bottom:6px\">Parent<\u002Fdiv>\n        <p style=\"font-family:var(--font-body);font-size:15px;line-height:1.55;color:var(--text-body-dark);margin:0 0 8px;padding-top:9px;border-top:1px solid var(--line-dark);text-wrap:pretty\">Keep a banana and a bottle in the bag every single game. Same two things.<\u002Fp>\n        <p style=\"font-family:var(--font-body);font-size:15px;line-height:1.55;color:var(--text-body-dark);margin:0;padding-top:9px;border-top:1px solid var(--line-dark);text-wrap:pretty\">Energy drinks are not part of this plan at this age.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"pk\" style=\"background:var(--ink-lift);border:1px solid var(--line-dark);border-radius:14px;padding:clamp(18px,2.4vw,26px)\">\n    <div style=\"display:flex;align-items:baseline;gap:12px;margin-bottom:12px\">\n      <h3 style=\"flex:1;font-family:var(--font-display);text-transform:uppercase;font-size:20px;line-height:1;letter-spacing:0.01em;color:var(--bone);margin:0\">Halftime and after the buzzer<\u002Fh3>\n      <span style=\"font-family:var(--font-eyebrow);font-weight:700;font-size:0.72rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--text-faint-dark)\">The recovery window<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))\">\n      <div>\n        <div style=\"font-family:var(--font-eyebrow);font-weight:700;font-size:0.7rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--fast-red);margin-bottom:6px\">Player<\u002Fdiv>\n        <label style=\"display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n          <input type=\"checkbox\" data-k=\"f.10\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:1px 0 0;cursor:pointer\">\n          <span style=\"flex:1;font-family:var(--font-body);font-size:16px;line-height:1.4;color:var(--bone)\">Halftime: sips, not gulps. Orange slices if they are there.<\u002Fspan>\n        <\u002Flabel>\n        <label style=\"display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n          <input type=\"checkbox\" data-k=\"f.11\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:1px 0 0;cursor:pointer\">\n          <span style=\"flex:1;font-family:var(--font-body);font-size:16px;line-height:1.4;color:var(--bone)\">Inside thirty minutes after: a protein and a carb. Eat before you shower.<\u002Fspan>\n        <\u002Flabel>\n        <label style=\"display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n          <input type=\"checkbox\" data-k=\"f.12\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:1px 0 0;cursor:pointer\">\n          <span style=\"flex:1;font-family:var(--font-body);font-size:16px;line-height:1.4;color:var(--bone)\">Finish the bottle on the drive home. Tomorrow starts tonight.<\u002Fspan>\n        <\u002Flabel>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family:var(--font-eyebrow);font-weight:700;font-size:0.7rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--text-label-dark);margin-bottom:6px\">Parent<\u002Fdiv>\n        <p style=\"font-family:var(--font-body);font-size:15px;line-height:1.55;color:var(--text-body-dark);margin:0 0 8px;padding-top:9px;border-top:1px solid var(--line-dark);text-wrap:pretty\">Have the food in the car. The Post-Practice Bowl on the next tab reheats and travels.<\u002Fp>\n        <p style=\"font-family:var(--font-body);font-size:15px;line-height:1.55;color:var(--text-body-dark);margin:0;padding-top:9px;border-top:1px solid var(--line-dark);text-wrap:pretty\">On the drive home, name one thing that went right before you name anything else. That is the whole coaching note.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"pk\" style=\"border-top:1px solid var(--line-dark);padding-top:22px;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap\">\n    <img class=\"np\" src=\"76cba028-514e-4c1e-b675-65b40bf3bc0a\" width=\"250\" height=\"106\" alt=\"Fast Basketball\" style=\"width:250px;height:auto\">\n    <img class=\"plogo\" src=\"752c4ea2-717f-46a3-bcbd-ee48ab74496b\" width=\"250\" height=\"106\" alt=\"Fast Basketball\" style=\"width:250px;height:auto;display:none\">\n    <div style=\"font-family:var(--font-body);font-size:14px;line-height:1.7;color:var(--text-faint-dark);text-align:right\">\n      <div>fastbasketball.com<\u002Fdiv>\n      <div>[coach@fastbasketball.com] · [(954) 000-0000]<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Farticle>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isRecipe }}\" hint-placeholder-val=\"{{ false }}\">\n<article data-screen-label=\"Recipe\" style=\"display:grid;gap:16px;animation:fbRise var(--t-reveal) var(--ease-rush) both\">\n\n  <div class=\"pk\" style=\"background:var(--ink-lift);border:1px solid var(--line-dark);border-radius:18px;padding:clamp(20px,3vw,34px)\">\n    <div style=\"display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px\">\n      <span class=\"eyebrow\" style=\"color:var(--bone)\">Recipe<\u002Fspan>\n    <\u002Fdiv>\n    <h1 style=\"font-family:var(--font-display);text-transform:uppercase;font-size:clamp(2.1rem,5.4vw,3.4rem);line-height:0.94;letter-spacing:0.01em;color:var(--bone);margin:0 0 16px\">The post-practice <span class=\"hollow\">bowl.<\u002Fspan><\u002Fh1>\n    <p style=\"font-family:var(--font-body);font-size:var(--text-lede);line-height:1.6;color:var(--text-lede-dark);max-width:62ch;margin:0;text-wrap:pretty\">One pan, twelve minutes, and a sixteen-year-old can cook it alone without setting anything on fire. Protein and carbs inside the window, which is the entire point.<\u002Fp>\n    <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-top:22px\">\n      <span style=\"font-family:var(--font-eyebrow);font-weight:700;font-size:0.74rem;letter-spacing:0.16em;text-transform:uppercase;color:#FFFFFF;background:var(--fast-red);border-radius:100px;padding:7px 15px;display:inline-flex;align-items:center;white-space:nowrap;flex:none\">12 Minutes<\u002Fspan>\n      <span style=\"font-family:var(--font-eyebrow);font-weight:700;font-size:0.74rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--text-dim-dark);border:1px solid var(--line-dark);border-radius:100px;padding:7px 15px;display:inline-flex;align-items:center;white-space:nowrap;flex:none\">One Pan<\u002Fspan>\n      <span style=\"font-family:var(--font-eyebrow);font-weight:700;font-size:0.74rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--text-dim-dark);border:1px solid var(--line-dark);border-radius:100px;padding:7px 15px;display:inline-flex;align-items:center;white-space:nowrap;flex:none\">Feeds 2<\u002Fspan>\n      <span style=\"font-family:var(--font-eyebrow);font-weight:700;font-size:0.74rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--text-dim-dark);border:1px solid var(--line-dark);border-radius:100px;padding:7px 15px;display:inline-flex;align-items:center;white-space:nowrap;flex:none\">About [$4] a bowl<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))\">\n    <div class=\"pk\" style=\"background:var(--ink-lift);border:1px solid var(--line-dark);border-radius:14px;padding:clamp(18px,2.4vw,26px)\">\n      <div style=\"font-family:var(--font-eyebrow);font-weight:700;font-size:0.7rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--fast-red);margin-bottom:8px\">Player<\u002Fdiv>\n      <p style=\"font-family:var(--font-body);font-size:16px;line-height:1.55;color:var(--bone);margin:0;text-wrap:pretty\">You can cook this alone. Read the whole thing once before you turn the stove on, then work down the list.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"pk\" style=\"background:var(--ink-lift);border:1px solid var(--line-dark);border-radius:14px;padding:clamp(18px,2.4vw,26px)\">\n      <div style=\"font-family:var(--font-eyebrow);font-weight:700;font-size:0.7rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--text-label-dark);margin-bottom:8px\">Parent<\u002Fdiv>\n      <p style=\"font-family:var(--font-body);font-size:16px;line-height:1.55;color:var(--text-body-dark);margin:0;text-wrap:pretty\">Buy double. It doubles cleanly, reheats without turning to glue, and covers the drive home after a road game.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"pk\" style=\"background:var(--ink-lift);border:1px solid var(--line-dark);border-radius:14px;padding:clamp(18px,2.4vw,26px)\">\n    <div style=\"display:flex;align-items:baseline;gap:12px;margin-bottom:2px\">\n      <h3 style=\"flex:1;font-family:var(--font-display);text-transform:uppercase;font-size:20px;line-height:1;letter-spacing:0.01em;color:var(--bone);margin:0\">In the cart<\u002Fh3>\n      <span style=\"font-family:var(--font-eyebrow);font-weight:700;font-size:0.72rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--text-faint-dark)\">Tick as you shop<\u002Fspan>\n    <\u002Fdiv>\n    <label style=\"display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n      <input type=\"checkbox\" data-k=\"r.1\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:1px 0 0;cursor:pointer\">\n      <span style=\"flex:1;font-family:var(--font-body);font-size:16px;line-height:1.4;color:var(--bone)\">Two cups cooked rice. Make it the night before, cold rice fries better.<\u002Fspan>\n    <\u002Flabel>\n    <label style=\"display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n      <input type=\"checkbox\" data-k=\"r.2\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:1px 0 0;cursor:pointer\">\n      <span style=\"flex:1;font-family:var(--font-body);font-size:16px;line-height:1.4;color:var(--bone)\">One pound ground turkey or chicken thigh.<\u002Fspan>\n    <\u002Flabel>\n    <label style=\"display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n      <input type=\"checkbox\" data-k=\"r.3\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:1px 0 0;cursor:pointer\">\n      <span style=\"flex:1;font-family:var(--font-body);font-size:16px;line-height:1.4;color:var(--bone)\">One bag frozen stir-fry vegetables.<\u002Fspan>\n    <\u002Flabel>\n    <label style=\"display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n      <input type=\"checkbox\" data-k=\"r.4\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:1px 0 0;cursor:pointer\">\n      <span style=\"flex:1;font-family:var(--font-body);font-size:16px;line-height:1.4;color:var(--bone)\">Two eggs.<\u002Fspan>\n    <\u002Flabel>\n    <label style=\"display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n      <input type=\"checkbox\" data-k=\"r.5\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:1px 0 0;cursor:pointer\">\n      <span style=\"flex:1;font-family:var(--font-body);font-size:16px;line-height:1.4;color:var(--bone)\">Soy sauce, garlic powder, olive oil.<\u002Fspan>\n    <\u002Flabel>\n    <label style=\"display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n      <input type=\"checkbox\" data-k=\"r.6\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:1px 0 0;cursor:pointer\">\n      <span style=\"flex:1;font-family:var(--font-body);font-size:16px;line-height:1.4;color:var(--bone)\">A lime, if there is one in the house.<\u002Fspan>\n    <\u002Flabel>\n  <\u002Fdiv>\n\n  <div class=\"pk\" style=\"background:var(--ink-lift);border:1px solid var(--line-dark);border-radius:14px;padding:clamp(18px,2.4vw,26px)\">\n    <h3 style=\"font-family:var(--font-display);text-transform:uppercase;font-size:20px;line-height:1;letter-spacing:0.01em;color:var(--bone);margin:0 0 2px\">The twelve minutes<\u002Fh3>\n    <label style=\"display:flex;gap:14px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n      <input type=\"checkbox\" data-k=\"r.s1\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:3px 0 0;cursor:pointer\">\n      <b style=\"font-family:var(--font-num);font-size:22px;line-height:1.1;color:var(--fast-red);flex:none;width:26px\">01<\u002Fb>\n      <span style=\"flex:1;font-family:var(--font-body);font-size:16px;line-height:1.45;color:var(--bone)\">Oil in the pan, medium high. Give it two minutes to actually get hot.<\u002Fspan>\n    <\u002Flabel>\n    <label style=\"display:flex;gap:14px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n      <input type=\"checkbox\" data-k=\"r.s2\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:3px 0 0;cursor:pointer\">\n      <b style=\"font-family:var(--font-num);font-size:22px;line-height:1.1;color:var(--fast-red);flex:none;width:26px\">02<\u002Fb>\n      <span style=\"flex:1;font-family:var(--font-body);font-size:16px;line-height:1.45;color:var(--bone)\">Turkey in. Break it up with the spoon. Cook until there is no pink left, about six minutes.<\u002Fspan>\n    <\u002Flabel>\n    <label style=\"display:flex;gap:14px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n      <input type=\"checkbox\" data-k=\"r.s3\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:3px 0 0;cursor:pointer\">\n      <b style=\"font-family:var(--font-num);font-size:22px;line-height:1.1;color:var(--fast-red);flex:none;width:26px\">03<\u002Fb>\n      <span style=\"flex:1;font-family:var(--font-body);font-size:16px;line-height:1.45;color:var(--bone)\">Frozen vegetables straight in from the bag. No thawing. Three minutes.<\u002Fspan>\n    <\u002Flabel>\n    <label style=\"display:flex;gap:14px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n      <input type=\"checkbox\" data-k=\"r.s4\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:3px 0 0;cursor:pointer\">\n      <b style=\"font-family:var(--font-num);font-size:22px;line-height:1.1;color:var(--fast-red);flex:none;width:26px\">04<\u002Fb>\n      <span style=\"flex:1;font-family:var(--font-body);font-size:16px;line-height:1.45;color:var(--bone)\">Push it all to one side. Crack the eggs into the empty half, scramble them there, then fold everything together.<\u002Fspan>\n    <\u002Flabel>\n    <label style=\"display:flex;gap:14px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n      <input type=\"checkbox\" data-k=\"r.s5\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:3px 0 0;cursor:pointer\">\n      <b style=\"font-family:var(--font-num);font-size:22px;line-height:1.1;color:var(--fast-red);flex:none;width:26px\">05<\u002Fb>\n      <span style=\"flex:1;font-family:var(--font-body);font-size:16px;line-height:1.45;color:var(--bone)\">Rice in last with the soy sauce and garlic powder. Toss for one minute. Lime over the top.<\u002Fspan>\n    <\u002Flabel>\n    <label style=\"display:flex;gap:14px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n      <input type=\"checkbox\" data-k=\"r.s6\" style=\"accent-color:var(--fast-red);width:20px;height:20px;flex:none;margin:3px 0 0;cursor:pointer\">\n      <b style=\"font-family:var(--font-num);font-size:22px;line-height:1.1;color:var(--fast-red);flex:none;width:26px\">06<\u002Fb>\n      <span style=\"flex:1;font-family:var(--font-body);font-size:16px;line-height:1.45;color:var(--bone)\">Eat it inside thirty minutes of walking in the door. Wash the pan while it cools.<\u002Fspan>\n    <\u002Flabel>\n  <\u002Fdiv>\n\n  <div class=\"pk\" style=\"background:var(--ink-lift);border:1px solid var(--line-dark);border-radius:14px;padding:clamp(18px,2.4vw,26px)\">\n    <h3 style=\"font-family:var(--font-display);text-transform:uppercase;font-size:20px;line-height:1;letter-spacing:0.01em;color:var(--bone);margin:0 0 14px\">Swap anything<\u002Fh3>\n    <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n      <span style=\"font-family:var(--font-body);font-size:15px;color:var(--text-body-dark);border:1px solid var(--line-dark);border-radius:100px;padding:8px 16px;display:inline-flex;align-items:center\">Turkey to canned tuna<\u002Fspan>\n      <span style=\"font-family:var(--font-body);font-size:15px;color:var(--text-body-dark);border:1px solid var(--line-dark);border-radius:100px;padding:8px 16px;display:inline-flex;align-items:center\">Turkey to black beans<\u002Fspan>\n      <span style=\"font-family:var(--font-body);font-size:15px;color:var(--text-body-dark);border:1px solid var(--line-dark);border-radius:100px;padding:8px 16px;display:inline-flex;align-items:center\">Rice to pasta<\u002Fspan>\n      <span style=\"font-family:var(--font-body);font-size:15px;color:var(--text-body-dark);border:1px solid var(--line-dark);border-radius:100px;padding:8px 16px;display:inline-flex;align-items:center\">Rice to potatoes<\u002Fspan>\n      <span style=\"font-family:var(--font-body);font-size:15px;color:var(--text-body-dark);border:1px solid var(--line-dark);border-radius:100px;padding:8px 16px;display:inline-flex;align-items:center\">Frozen veg to whatever is in the fridge<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"margin-top:18px;border-left:3px solid var(--fast-red);background:var(--red-tint);border-radius:0 10px 10px 0;padding:14px 18px\">\n      <p style=\"font-family:var(--font-body);font-weight:600;font-size:16px;line-height:1.5;color:var(--bone);margin:0;text-wrap:pretty\">Why Coach Blake keeps this one: it is cheap, it is fast, and it is a meal a player can own themselves. Owning your own food is the same habit as owning your own reps.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"pk\" style=\"border-top:1px solid var(--line-dark);padding-top:22px;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap\">\n    <img class=\"np\" src=\"76cba028-514e-4c1e-b675-65b40bf3bc0a\" width=\"250\" height=\"106\" alt=\"Fast Basketball\" style=\"width:250px;height:auto\">\n    <img class=\"plogo\" src=\"752c4ea2-717f-46a3-bcbd-ee48ab74496b\" width=\"250\" height=\"106\" alt=\"Fast Basketball\" style=\"width:250px;height:auto;display:none\">\n    <div style=\"font-family:var(--font-body);font-size:14px;line-height:1.7;color:var(--text-faint-dark);text-align:right\">\n      <div>fastbasketball.com<\u002Fdiv>\n      <div>[coach@fastbasketball.com] · [(954) 000-0000]<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Farticle>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isMidnight }}\" hint-placeholder-val=\"{{ false }}\">\n<article data-screen-label=\"The Midnight Set\" style=\"display:grid;gap:16px;animation:fbRise var(--t-reveal) var(--ease-rush) both\">\n\n  <div class=\"pk\" style=\"background:var(--ink-lift);border:1px solid var(--teal-line);border-radius:18px;padding:clamp(20px,3vw,34px)\">\n    <div style=\"display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px\">\n      <span style=\"font-family:var(--font-eyebrow);font-weight:700;font-size:var(--text-eyebrow);letter-spacing:var(--track-eyebrow);text-transform:uppercase;color:var(--miami-teal)\">Unlocked<\u002Fspan>\n    <\u002Fdiv>\n    <h1 style=\"font-family:var(--font-display);text-transform:uppercase;font-size:clamp(2.1rem,5.4vw,3.4rem);line-height:0.94;letter-spacing:0.01em;color:var(--bone);margin:0 0 16px\">The midnight set.<\u002Fh1>\n    <p style=\"font-family:var(--font-body);font-size:var(--text-lede);line-height:1.6;color:var(--text-lede-dark);max-width:62ch;margin:0;text-wrap:pretty\">Twelve minutes Coach Blake did after everyone else had gone home, when the gym was empty and nobody was counting but him. You found it by making a shot, so you have already got the idea.<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"pk\" style=\"background:var(--ink-lift);border:1px solid var(--line-dark);border-radius:14px;padding:clamp(18px,2.4vw,26px)\">\n    <label style=\"display:flex;gap:14px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n      <input type=\"checkbox\" data-k=\"m.1\" style=\"accent-color:var(--miami-teal);width:20px;height:20px;flex:none;margin:2px 0 0;cursor:pointer\">\n      <span style=\"flex:1;min-width:0\">\n        <span style=\"display:block;font-family:var(--font-body);font-weight:600;font-size:16px;line-height:1.35;color:var(--bone)\">One hundred makes before the lights go off<\u002Fspan>\n        <span style=\"display:block;font-family:var(--font-body);font-size:14px;line-height:1.45;color:var(--text-dim-dark);margin-top:3px\">Makes. Not shots. There is a difference and you know it.<\u002Fspan>\n      <\u002Fspan>\n    <\u002Flabel>\n    <label style=\"display:flex;gap:14px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n      <input type=\"checkbox\" data-k=\"m.2\" style=\"accent-color:var(--miami-teal);width:20px;height:20px;flex:none;margin:2px 0 0;cursor:pointer\">\n      <span style=\"flex:1;min-width:0\">\n        <span style=\"display:block;font-family:var(--font-body);font-weight:600;font-size:16px;line-height:1.35;color:var(--bone)\">Twenty-five free throws, one at a time<\u002Fspan>\n        <span style=\"display:block;font-family:var(--font-body);font-size:14px;line-height:1.45;color:var(--text-dim-dark);margin-top:3px\">Full routine on every one. Walk away and come back between each.<\u002Fspan>\n      <\u002Fspan>\n    <\u002Flabel>\n    <label style=\"display:flex;gap:14px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n      <input type=\"checkbox\" data-k=\"m.3\" style=\"accent-color:var(--miami-teal);width:20px;height:20px;flex:none;margin:2px 0 0;cursor:pointer\">\n      <span style=\"flex:1;min-width:0\">\n        <span style=\"display:block;font-family:var(--font-body);font-weight:600;font-size:16px;line-height:1.35;color:var(--bone)\">Ten makes from the spot you missed from tonight<\u002Fspan>\n        <span style=\"display:block;font-family:var(--font-body);font-size:14px;line-height:1.45;color:var(--text-dim-dark);margin-top:3px\">You remember the spot. Go stand on it.<\u002Fspan>\n      <\u002Fspan>\n    <\u002Flabel>\n    <label style=\"display:flex;gap:14px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n      <input type=\"checkbox\" data-k=\"m.4\" style=\"accent-color:var(--miami-teal);width:20px;height:20px;flex:none;margin:2px 0 0;cursor:pointer\">\n      <span style=\"flex:1;min-width:0\">\n        <span style=\"display:block;font-family:var(--font-body);font-weight:600;font-size:16px;line-height:1.35;color:var(--bone)\">Two minutes of nothing but the weak hand<\u002Fspan>\n        <span style=\"display:block;font-family:var(--font-body);font-size:14px;line-height:1.45;color:var(--text-dim-dark);margin-top:3px\">Every college guard can go both ways. Every one.<\u002Fspan>\n      <\u002Fspan>\n    <\u002Flabel>\n    <label style=\"display:flex;gap:14px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line-dark);cursor:pointer\">\n      <input type=\"checkbox\" data-k=\"m.5\" style=\"accent-color:var(--miami-teal);width:20px;height:20px;flex:none;margin:2px 0 0;cursor:pointer\">\n      <span style=\"flex:1;min-width:0\">\n        <span style=\"display:block;font-family:var(--font-body);font-weight:600;font-size:16px;line-height:1.35;color:var(--bone)\">Call the game, take the shot, walk out<\u002Fspan>\n        <span style=\"display:block;font-family:var(--font-body);font-size:14px;line-height:1.45;color:var(--text-dim-dark);margin-top:3px\">Out loud. Even with nobody there. Especially with nobody there.<\u002Fspan>\n      <\u002Fspan>\n    <\u002Flabel>\n    <div style=\"margin-top:18px;border-left:3px solid var(--miami-teal);background:rgba(37,224,208,0.07);border-radius:0 10px 10px 0;padding:14px 18px\">\n      <p style=\"font-family:var(--font-body);font-weight:600;font-size:16px;line-height:1.5;color:var(--bone);margin:0;text-wrap:pretty\">Nobody is watching. That is the entire point of the set.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"pk\" style=\"border-top:1px solid var(--line-dark);padding-top:22px;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap\">\n    <img class=\"np\" src=\"76cba028-514e-4c1e-b675-65b40bf3bc0a\" width=\"250\" height=\"106\" alt=\"Fast Basketball\" style=\"width:250px;height:auto\">\n    <img class=\"plogo\" src=\"752c4ea2-717f-46a3-bcbd-ee48ab74496b\" width=\"250\" height=\"106\" alt=\"Fast Basketball\" style=\"width:250px;height:auto;display:none\">\n    <div style=\"font-family:var(--font-body);font-size:14px;line-height:1.7;color:var(--text-faint-dark);text-align:right\">\n      <div>fastbasketball.com<\u002Fdiv>\n      <div>[coach@fastbasketball.com] · [(954) 000-0000]<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Farticle>\n<\u002Fsc-if>\n\n<\u002Fmain>\n\n<sc-if value=\"{{ shootOpen }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"np\" style=\"position:fixed;inset:0;z-index:400;background:rgba(10,10,12,0.86);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:16px\">\n  <div style=\"width:min(440px,100%);background:var(--ink);border:1px solid var(--line-dark);border-radius:18px;overflow:hidden;box-shadow:var(--shadow-card)\">\n    <div style=\"display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line-dark)\">\n      <span style=\"flex:1;font-family:var(--font-eyebrow);font-weight:700;font-size:0.82rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--bone)\">Shoot around<\u002Fspan>\n      <span style=\"font-family:var(--font-num);font-size:20px;color:var(--fast-red);line-height:1\">{{ makesLabel }}<\u002Fspan>\n      <button type=\"button\" sc-camel-on-click=\"{{ toggleShoot }}\" aria-label=\"Close\" style=\"width:44px;height:44px;border-radius:100px;border:1px solid var(--line-dark);background:transparent;color:var(--text-dim-dark);font-family:var(--font-body);font-size:18px;cursor:pointer\">×<\u002Fbutton>\n    <\u002Fdiv>\n    <canvas data-court=\"1\" ref=\"{{ cvsRef }}\" style=\"display:block;width:100%;height:min(56vh,400px);touch-action:none;cursor:grab\"><\u002Fcanvas>\n    <p style=\"margin:0;padding:12px 16px 16px;font-family:var(--font-body);font-size:14px;line-height:1.5;color:var(--text-faint-dark);text-align:center\">Drag the ball back and let go. Sink one and something opens up.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ toast }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"np\" role=\"status\" style=\"position:fixed;left:50%;bottom:26px;z-index:500;transform:translateX(-50%);background:var(--ink-lift);border:1px solid var(--teal-line);border-radius:100px;padding:13px 24px;font-family:var(--font-eyebrow);font-weight:700;font-size:0.82rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--miami-teal);box-shadow:var(--shadow-sheet);animation:fbToast var(--t-hover) var(--ease-rush) both\">{{ toast }}<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1100},&quot;startSheet&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;daily&quot;,&quot;block&quot;,&quot;fuel&quot;,&quot;recipe&quot;],&quot;default&quot;:&quot;daily&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Sheets&quot;},&quot;easterEgg&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Shoot around&quot;},&quot;makesToUnlock&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1,&quot;min&quot;:1,&quot;max&quot;:5,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Shoot around&quot;}}\">\nclass Component extends DCLogic {\n  KEY = 'fb_locker_templates_v1';\n  railRef = React.createRef();\n  sheetRef = React.createRef();\n  cvsRef = React.createRef();\n  state = {\n    tab: this.props.startSheet || 'daily',\n    vals: {}, unlocked: false, makes: 0,\n    shootOpen: false, toast: '', done: 0, total: 0\n  };\n\n  componentDidMount(){\n    let s = {};\n    try { s = JSON.parse(localStorage.getItem(this.KEY) || '{}'); } catch(e){}\n    /* this.store, not this.state, is the source of truth for persistence:\n       setState callbacks in this runtime still see pre-update state. */\n    this.store = { vals: s.vals || {}, unlocked: !!s.unlocked, makes: s.makes || 0 };\n    this.setState({\n      vals: this.store.vals, unlocked: this.store.unlocked, makes: this.store.makes\n    }, this.sync);\n    this.onKey = e => { if(e.key === 'Escape' && this.state.shootOpen) this.toggleShoot(); };\n    window.addEventListener('keydown', this.onKey);\n  }\n  componentWillUnmount(){\n    window.removeEventListener('keydown', this.onKey);\n    clearTimeout(this.tt);\n  }\n\n  persist(patch){\n    this.store = Object.assign({}, this.store, patch);\n    try { localStorage.setItem(this.KEY, JSON.stringify(this.store)); } catch(e){}\n  }\n\n  /* Restores saved answers into the literal sheet markup. Imperative on purpose:\n     it keeps every row as plain, directly editable HTML. */\n  sync = () => {\n    const sh = this.sheetRef.current;\n    if(!sh) return;\n    const v = this.store ? this.store.vals : {};\n    sh.querySelectorAll('[data-k]').forEach(el => {\n      const val = v[el.dataset.k];\n      if(el.type === 'checkbox') el.checked = !!val;\n      else el.value = val == null ? '' : val;\n    });\n    this.count();\n  };\n\n  count(){\n    const sh = this.sheetRef.current;\n    if(!sh) return;\n    const boxes = sh.querySelectorAll('input[type=\"checkbox\"]');\n    let done = 0;\n    boxes.forEach(b => { if(b.checked) done++; });\n    if(done !== this.state.done || boxes.length !== this.state.total)\n      this.setState({ done, total: boxes.length });\n  }\n\n  onCheck = e => {\n    const el = e.target;\n    const k = el.dataset && el.dataset.k;\n    if(!k) return;\n    const on = el.type === 'checkbox' ? el.checked : el.value;\n    const next = el.type === 'checkbox' ? true : el.value;\n    let latest = null;\n    this.setState(s => {\n      const vals = Object.assign({}, s.vals);\n      if(on) vals[k] = next; else delete vals[k];\n      latest = vals;\n      return { vals };\n    }, () => { this.persist({ vals: latest }); this.count(); });\n  };\n\n  onTab = e => {\n    const b = e.target.closest('[data-t]');\n    if(!b) return;\n    this.setState({ tab: b.dataset.t }, this.sync);\n  };\n\n  resetSheet = () => {\n    const sh = this.sheetRef.current;\n    if(!sh) return;\n    const vals = Object.assign({}, this.store.vals);\n    sh.querySelectorAll('[data-k]').forEach(el => { delete vals[el.dataset.k]; });\n    this.persist({ vals });\n    this.setState({ vals }, this.sync);\n  };\n\n  printSheet = () => { window.print(); };\n  /* Neither the setState callback nor the ref hole is reliable for a node that\n     mounts inside an sc-if, so the canvas is resolved from the DOM by polling. */\n  /* The ref can hold a detached node from a previous render — only trust it if\n     it is still in the document. */\n  canvas(){\n    const r = this.cvsRef.current;\n    if(r && r.isConnected) return r;\n    return document.querySelector('canvas[data-court]');\n  }\n\n  toggleShoot = () => {\n    const open = !this.state.shootOpen;\n    this.setState({ shootOpen: open });\n    if(open) this.ensureLoop(); else this.stopGame();\n  };\n\n  flash(msg){\n    clearTimeout(this.tt);\n    this.setState({ toast: msg });\n    this.tt = setTimeout(() => this.setState({ toast: '' }), 2600);\n  }\n\n  /* ---------------------------------------------------- shoot around ---\n     One self-healing loop. Each tick re-resolves the canvas from the DOM and\n     re-adopts it if the node changed or was never wired, so the court survives\n     re-renders, remounts and stale refs. A timer, not rAF: the animation clock\n     is frozen in some preview contexts. */\n  ensureLoop = () => {\n    window.__fbHost = this;\n    if(window.__fbLoop) return;\n    window.__fbLoop = setInterval(() => {\n      const host = window.__fbHost;\n      const c = document.querySelector('canvas[data-court]');\n      if(!c || !c.isConnected || !host) return;\n      let g = c.__fb;\n      const busy = g && (g.drag || g.ball.live);\n      if(!g || (!busy && (Math.abs(g.W - c.clientWidth) > 2 || Math.abs(g.H - c.clientHeight) > 2))) g = host.initCourt(c);\n      const now = performance.now();\n      /* Sub-step the real elapsed time so the shot keeps true speed even when the\n         timer is throttled — choppier, never slow motion. */\n      let acc = Math.min(0.25, (now - (g.t || now)) / 1000);\n      g.t = now;\n      while(acc > 0){ const dt = Math.min(0.016, acc); host.tick(dt, g); acc -= dt; }\n      host.draw(g);\n    }, 16);\n  };\n\n  /* State lives on the canvas node, not the instance, so listeners and loop keep\n     working across re-renders no matter which instance is hosting. */\n  initCourt(c){\n    const W = c.clientWidth || 400, H = c.clientHeight || 360;\n    const dpr = Math.min(2, window.devicePixelRatio || 1);\n    c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);\n    const ctx = c.getContext('2d');\n    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n    const rimX = W - 78, rimY = Math.round(H * 0.36), rimW = 27;\n    c.__fb = {\n      W, H, ctx, rimX, rimY, rimW, bbX: rimX + rimW + 9,\n      ball: { x: 54, y: H - 44, r: 13, vx: 0, vy: 0, live: false, px: 54, py: H - 44, scored: false },\n      drag: null, flash: 0, settle: 0, shots: 0, t: 0\n    };\n    if(!c.dataset.wired){\n      c.dataset.wired = '1';\n      const at = e => { const r = c.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };\n      c.addEventListener('pointerdown', e => {\n        const g = c.__fb; if(!g || g.ball.live) return;\n        const p = at(e);\n        if(Math.hypot(p.x - g.ball.x, p.y - g.ball.y) < 70){\n          g.drag = p; c.style.cursor = 'grabbing';\n          try { c.setPointerCapture(e.pointerId); } catch(err){}\n        }\n      });\n      c.addEventListener('pointermove', e => { const g = c.__fb; if(g && g.drag) g.drag = at(e); });\n      const release = () => {\n        const g = c.__fb; if(!g || !g.drag) return;\n        const b = g.ball, dx = b.x - g.drag.x, dy = b.y - g.drag.y;\n        const m = Math.hypot(dx, dy);\n        g.drag = null; c.style.cursor = 'grab';\n        if(m < 10) return;\n        const k = Math.min(m, 170) / (m || 1) * 5.4;\n        b.vx = dx * k; b.vy = dy * k; b.live = true; b.scored = false; g.shots++;\n      };\n      c.addEventListener('pointerup', release);\n      c.addEventListener('pointercancel', release);\n    }\n    return c.__fb;\n  }\n\n  /* Only drops the court state. The loop is never torn down — it idles whenever\n     no canvas is in the DOM, and the host is reassigned on every render. */\n  stopGame(){\n    const c = this.canvas();\n    if(c) c.__fb = null;\n  }\n\n  resetBall(g){\n    if(!g) return;\n    g.ball.x = 54; g.ball.y = g.H - 44; g.ball.vx = 0; g.ball.vy = 0;\n    g.ball.live = false; g.ball.scored = false; g.settle = 0;\n  }\n\n  tick(dt, g){\n    if(!g) return;\n    if(g.flash > 0) g.flash -= dt;\n    const b = g.ball;\n    if(!b.live) return;\n    b.px = b.x; b.py = b.y;\n    b.vy += 1500 * dt;\n    b.x += b.vx * dt; b.y += b.vy * dt;\n    if(b.px + b.r <= g.bbX && b.x + b.r > g.bbX && b.y > g.rimY - 98 && b.y < g.rimY + 6){\n      b.x = g.bbX - b.r; b.vx = -Math.abs(b.vx) * 0.55; b.vy *= 0.92;\n    }\n    const knots = [[g.rimX - g.rimW, g.rimY], [g.rimX + g.rimW, g.rimY]];\n    for(let i = 0; i < 2; i++){\n      const kx = knots[i][0], ky = knots[i][1];\n      const dx = b.x - kx, dy = b.y - ky, d = Math.hypot(dx, dy), min = b.r + 4;\n      if(d < min && d > 0.01){\n        const nx = dx / d, ny = dy / d;\n        b.x = kx + nx * min; b.y = ky + ny * min;\n        const dot = b.vx * nx + b.vy * ny;\n        b.vx = (b.vx - 2 * dot * nx) * 0.6; b.vy = (b.vy - 2 * dot * ny) * 0.6;\n      }\n    }\n    if(!b.scored && b.py < g.rimY && b.y >= g.rimY && b.vy > 0){\n      /* Interpolate where it crossed the rim plane — a fast ball can step past it. */\n      const f = (g.rimY - b.py) / ((b.y - b.py) || 1);\n      const cx = b.px + (b.x - b.px) * f;\n      if(Math.abs(cx - g.rimX) < g.rimW - 5){ b.scored = true; g.flash = 1.2; this.madeShot(); }\n    }\n    if(b.y > g.H - 10 - b.r){\n      b.y = g.H - 10 - b.r; b.vy *= -0.48; b.vx *= 0.86;\n      if(Math.abs(b.vy) < 70) g.settle += dt;\n    }\n    if(b.x < b.r){ b.x = b.r; b.vx *= -0.6; }\n    if(b.x > g.W - b.r){ b.x = g.W - b.r; b.vx *= -0.6; }\n    if(g.settle > 0.6 || b.y > g.H + 160) this.resetBall(g);\n  }\n\n  madeShot(){\n    const makes = (this.store.makes || 0) + 1;\n    const need = Math.max(1, this.props.makesToUnlock || 1);\n    const already = !!this.store.unlocked;\n    const unlocked = already || makes >= need;\n    this.persist({ makes, unlocked });\n    this.setState({ makes, unlocked });\n    this.flash(!already && unlocked ? 'Swish. The Midnight Set is unlocked.' : 'Swish.');\n  }\n\n  draw(g){\n    if(!g) return;\n    const x = g.ctx, W = g.W, H = g.H, b = g.ball;\n    x.clearRect(0, 0, W, H);\n    x.fillStyle = '#131318'; x.fillRect(0, 0, W, H);\n    x.strokeStyle = 'rgba(255,255,255,0.045)'; x.lineWidth = 1;\n    for(let i = 40; i < W; i += 40){ x.beginPath(); x.moveTo(i, 0); x.lineTo(i, H); x.stroke(); }\n    for(let j = 40; j < H; j += 40){ x.beginPath(); x.moveTo(0, j); x.lineTo(W, j); x.stroke(); }\n    x.strokeStyle = 'rgba(255,255,255,0.16)'; x.lineWidth = 2;\n    x.beginPath(); x.moveTo(0, H - 10); x.lineTo(W, H - 10); x.stroke();\n    /* backboard + target square */\n    x.fillStyle = 'rgba(255,255,255,0.14)';\n    x.fillRect(g.bbX, g.rimY - 98, 7, 104);\n    x.strokeStyle = 'rgba(255,255,255,0.4)'; x.lineWidth = 2;\n    x.strokeRect(g.bbX - 30, g.rimY - 48, 30, 40);\n    /* net */\n    x.strokeStyle = 'rgba(255,255,255,0.34)'; x.lineWidth = 1.4;\n    for(let n = 0; n <= 4; n++){\n      const t = n / 4;\n      x.beginPath();\n      x.moveTo(g.rimX - g.rimW + t * g.rimW * 2, g.rimY);\n      x.lineTo(g.rimX - g.rimW * 0.5 + t * g.rimW, g.rimY + 30);\n      x.stroke();\n    }\n    x.beginPath(); x.moveTo(g.rimX - g.rimW * 0.72, g.rimY + 16);\n    x.lineTo(g.rimX + g.rimW * 0.72, g.rimY + 16); x.stroke();\n    /* rim */\n    x.strokeStyle = '#E60C20'; x.lineWidth = 5; x.lineCap = 'round';\n    x.beginPath(); x.moveTo(g.rimX - g.rimW, g.rimY); x.lineTo(g.rimX + g.rimW, g.rimY); x.stroke();\n    /* aim guide */\n    if(g.drag){\n      const dx = b.x - g.drag.x, dy = b.y - g.drag.y, m = Math.hypot(dx, dy);\n      const k = Math.min(m, 170) / (m || 1) * 5.4;\n      const vx = dx * k, vy = dy * k;\n      x.setLineDash([2, 9]); x.lineWidth = 3; x.strokeStyle = 'rgba(230,12,32,0.75)';\n      x.beginPath();\n      for(let t = 0; t < 34; t++){\n        const s = t * 0.035;\n        x.lineTo(b.x + vx * s, b.y + vy * s + 0.5 * 1500 * s * s);\n      }\n      x.stroke(); x.setLineDash([]);\n      x.strokeStyle = 'rgba(255,255,255,0.28)'; x.lineWidth = 2;\n      x.beginPath(); x.moveTo(b.x, b.y); x.lineTo(g.drag.x, g.drag.y); x.stroke();\n    }\n    /* ball */\n    x.fillStyle = '#E60C20';\n    x.beginPath(); x.arc(b.x, b.y, b.r, 0, Math.PI * 2); x.fill();\n    x.strokeStyle = 'rgba(10,10,12,0.85)'; x.lineWidth = 1.6;\n    x.beginPath(); x.arc(b.x, b.y, b.r, 0, Math.PI * 2); x.stroke();\n    x.beginPath(); x.moveTo(b.x - b.r, b.y); x.lineTo(b.x + b.r, b.y); x.stroke();\n    x.beginPath(); x.moveTo(b.x, b.y - b.r); x.lineTo(b.x, b.y + b.r); x.stroke();\n    /* swish */\n    if(g.flash > 0){\n      x.globalAlpha = Math.min(1, g.flash);\n      x.fillStyle = '#25E0D0';\n      x.font = '700 34px Anton, Impact, sans-serif';\n      x.textAlign = 'center';\n      x.fillText('SWISH', g.rimX - 40, g.rimY + 82);\n      x.globalAlpha = 1;\n    }\n    if(!b.live && !g.drag && g.shots === 0){\n      x.fillStyle = 'rgba(255,255,255,0.42)';\n      x.font = '600 13px Barlow, system-ui, sans-serif';\n      x.textAlign = 'left';\n      x.fillText('Drag me back', 34, H - 74);\n    }\n  }\n\n  renderVals(){\n    const t = this.state.tab, total = this.state.total, done = this.state.done;\n    if(this.state.shootOpen) this.ensureLoop();\n    return {\n      dailyOn: String(t === 'daily'), blockOn: String(t === 'block'), fuelOn: String(t === 'fuel'),\n      recipeOn: String(t === 'recipe'), midnightOn: String(t === 'midnight'),\n      railRef: this.railRef, sheetRef: this.sheetRef, cvsRef: this.cvsRef,\n      isDaily: t === 'daily', isBlock: t === 'block', isFuel: t === 'fuel',\n      isRecipe: t === 'recipe', isMidnight: t === 'midnight',\n      unlocked: this.state.unlocked && this.props.easterEgg !== false,\n      shootOpen: this.state.shootOpen, toast: this.state.toast,\n      makesLabel: this.state.makes + (this.state.makes === 1 ? ' make' : ' makes'),\n      doneLabel: done + ' of ' + total + ' ticked',\n      pct: total ? Math.round(done / total * 100) + '%' : '0%',\n      onCheck: this.onCheck, onTab: this.onTab, resetSheet: this.resetSheet,\n      printSheet: this.printSheet, toggleShoot: this.toggleShoot\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
